schema: spec-driven

# Только карта источников и ограничения, которые агент не выведет из кода.
# Текст CLAUDE.md здесь не дублируется — на него ссылаемся.
context: |
  Артефакты пишутся по-русски; идентификаторы кода, пути и маршруты — как в коде.

  Где что лежит:
  - Инфраструктура, команды сборки и тестов, порты (PostgreSQL — 127.0.0.1:5433), миграции
    (ядро — контекст AppDbContext, модуль costs — CostsDbContext, контекст называть явно),
    храповики (npm run lint:ratchet, npm run ui:ratchet, FileSizeRatchet — 500 строк кода на файл)
    и CI — CLAUDE.md (его копия для других агентов — AGENTS.md).
  - Действующие доменные спецификации (построенное) — openspec/specs/: этапы 1–2 — core, auth,
    costs, id, types-and-tags; этап 3 — plan (растёт с каждым архивом plan-NN). Домен work
    появится при архивации первого change этапа 4. Общие компоненты интерфейса (shared/ui, оболочка, храповик
    интерфейса) — домен sharedui, метки [UI-*]; правила — docs/UI.md.
  - Issue в трекере — только баги и внешние запросы; change, сделанный по issue, называет его номер
    в proposal (раздел Why), а в PR — «Closes #N» по-английски (русское «Закрывает» issue не закрывает).
  - Полное ТЗ и требования будущих этапов — docs/tz/: этап 3 plan (50-планирование.md),
    этап 4 work (30-учёт-работ.md), этап 5 mob (40-мобильный-клиент.md), этап 6 первичка,
    этап 7 ozhr (60-ожр.md); состав и порядок этапов — 90-этапы.md.
  - Правила дизайн-системы — docs/UI.md; обоснования решений и архитектурные заметки —
    docs/DEV_NOTES.md.

rules:
  proposal:
    - Сохранять сквозную разметку требований метками ТЗ ([CORE-*], [AUTH-*], [COST-*], [PLAN-*], [WORK-*], [MOB-*], [OZHR-*], [ID-*], [TYPE-*], [UI-*], а также [OVW-*], [STG-*]); новое требование получает метку своей области
    - Не планировать правку <Version> в src/server/Directory.Build.props — версию поднимает CI после слияния (MINOR — меткой version:minor на PR)
    - Каждое новое пишущее API для сущностей модулей и общих данных защищено проверкой If-Match и воротами прав и модуля (AUTH-8, AUTH-9)
    - Для крупных этапов используй зонтичную задачу `<module>-00-epic` (общая архитектура и список PR в tasks.md) и дочерние задачи `<module>-01-<name>`, ссылающиеся на `../<module>-00-epic/design.md`.
  specs:
    - Сохранять сквозную разметку требований метками ТЗ ([CORE-*], [AUTH-*], [COST-*], [PLAN-*], [WORK-*], [MOB-*], [OZHR-*], [ID-*], [TYPE-*], [UI-*], а также [OVW-*], [STG-*]) в заголовках требований
    - Каждое новое пишущее API для сущностей модулей и общих данных описывает отказы If-Match (без заголовка — 400, устаревший — 409) и ворота прав и модуля (AUTH-8, AUTH-9) отдельными сценариями
  design:
    - Сохранять сквозную разметку требований метками ТЗ ([CORE-*], [AUTH-*], [COST-*], [PLAN-*], [WORK-*], [MOB-*], [OZHR-*], [ID-*], [TYPE-*], [UI-*], а также [OVW-*], [STG-*])
    - Не менять <Version> в src/server/Directory.Build.props вручную — версию поднимает CI
    - Каждое новое пишущее API для сущностей модулей и общих данных защищать проверкой If-Match и воротами прав и модуля (AUTH-8, AUTH-9); названное исключение — с обоснованием
  tasks:
    - Сохранять в задачах метки требований ТЗ, которые они закрывают ([CORE-*], [AUTH-*], [COST-*], [PLAN-*], [WORK-*], [MOB-*], [OZHR-*], [ID-*], [TYPE-*], [UI-*] и др.)
    - Не заводить задачу на правку <Version> в Directory.Build.props — версию поднимает CI
    - Задача на новое пишущее API включает проверку If-Match и ворот прав и модуля (AUTH-8, AUTH-9) с тестами отказов
    - "Последним разделом всегда идёт верификация: профильные тесты dotnet test (cd src/server && dotnet test BHS.CRG.Tests/BHS.CRG.Tests.csproj --filter …), cd src/client && npx tsc -b, cd src/client && npm run ui:ratchet и проверка лимита 500 строк кода (dotnet test … --filter FileSizeRatchet)"

# Указания фазам, а не артефактам: rules.apply OpenSpec не читает (ключи rules — только proposal/specs/design/tasks).
operations:
  apply:
    guidance:
      - Если в ходе реализации шаг из tasks.md или решение из design.md нарушает архитектурные тесты (ModuleBoundaryTests, FileSizeRatchet, ui:ratchet, *InventoryTests) или не стыкуется с кодом — сначала явно обнови design.md и tasks.md в папке текущего change, и только потом пиши код.
