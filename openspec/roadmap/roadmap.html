<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
/* Ведомость: лист-таблица с узкой колонкой номеров, группы — заголовки листа, две линии и этап после них */
:root {
  --paper: #F3F5F2;
  --sheet: #FFFFFF;
  --ink: #1B2220;
  --muted: #5B6863;
  --rule: #D6DCD7;
  --rule-strong: #AEB8B2;
  --accent: #1D5BB8;
  --accent-soft: #E6EEFA;
  --done: #2D7A4C;
  --done-soft: #E5F2EA;
  --warn: #9A5A00;
  --warn-soft: #FBF0DD;
  --code-bg: #EEF1EE;
  --f-display: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "PT Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "PT Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --sheet: #19201D; --ink: #E2E8E4; --muted: #94A39C; --rule: #2B3430;
    --rule-strong: #46524D; --accent: #7FA9F2; --accent-soft: #1C2A40; --done: #63BE89;
    --done-soft: #17291F; --warn: #E3A74E; --warn-soft: #2F2414; --code-bg: #222B27;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --sheet: #19201D; --ink: #E2E8E4; --muted: #94A39C; --rule: #2B3430;
  --rule-strong: #46524D; --accent: #7FA9F2; --accent-soft: #1C2A40; --done: #63BE89;
  --done-soft: #17291F; --warn: #E3A74E; --warn-soft: #2F2414; --code-bg: #222B27;
  color-scheme: dark;
}
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 34px; line-height: 1.1; }
h2 { font-size: 24px; line-height: 1.15; }
h3 { font-size: 18px; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--muted); }

header.top { display: grid; gap: 10px; }
.lead { max-width: 68ch; margin: 0; color: var(--muted); }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.summary > :only-child { grid-column: 1 / -1; }
@media (max-width: 760px) { .summary { grid-template-columns: 1fr; } }
.track-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; align-content: start; }
.track-card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.track-card .count { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
.bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); border-radius: 3px; transition: width .3s; }
.next { font-size: 14px; display: grid; gap: 6px; }
.next .lbl { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; color: var(--accent); }
.next p { margin: 0; overflow-wrap: anywhere; }
.linkbtn { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px; border-bottom: 1px solid var(--rule); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.toolbar input[type=search] { flex: 1 1 240px; min-width: 0; font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 6px 10px; background: var(--sheet); color: var(--ink); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--sheet); }
.btn { font: inherit; font-size: 13px; padding: 6px 10px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: 4px; cursor: pointer; }

section.track { display: grid; gap: 12px; }
section.track > .th { display: grid; gap: 4px; padding-top: 6px; }
section.track > .th p { margin: 0; max-width: 72ch; color: var(--muted); font-size: 14px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 4px; overflow: hidden; }
.group-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 9px 14px; background: var(--code-bg); border-bottom: 1px solid var(--rule-strong); }
.group-h .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.group + .group .group-h { border-top: 1px solid var(--rule-strong); }

.step { display: grid; grid-template-columns: 64px 28px minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.step:last-child { border-bottom: 0; }
.step .num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding: 12px 0 0 14px; border-right: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.step .chk { padding: 11px 0 0 8px; }
.step .body { padding: 10px 14px 12px 6px; display: grid; gap: 5px; min-width: 0; }
.step.is-done .num { color: var(--done); }
.step.is-done .main { color: var(--muted); }
.step.is-next { background: var(--accent-soft); }
.step.is-next .num { color: var(--accent); font-weight: 700; }
.step.withdrawn .main { text-decoration: line-through; text-decoration-color: var(--rule-strong); color: var(--muted); }
.step.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { box-shadow: inset 4px 0 0 var(--accent); background: var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .step.flash { animation: none; } .bar > i { transition: none; } }
.main { overflow-wrap: anywhere; }
.cname { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; overflow-wrap: anywhere; }
.cname .cid { font-size: 12px; color: var(--accent); background: var(--accent-soft); }
.cname .ctitle { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.2; }
.cname .ctitle code { font-size: .8em; }
.step.is-done .cname .ctitle, .step.withdrawn .cname .ctitle { color: var(--muted); }
.step.withdrawn .cname .ctitle { text-decoration: line-through; text-decoration-color: var(--rule-strong); }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.refs .rl { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: 12px; }
.refs .ref { overflow-wrap: anywhere; }
.refs .ref code { color: var(--accent); }
.sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.sub b { font-weight: 700; color: var(--ink); font-family: var(--f-display); letter-spacing: .03em; }
.tag { font-family: var(--f-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 0 3px; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.pill { font-family: var(--f-display); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.pill.pr { background: var(--code-bg); color: var(--muted); }
.pill.ok { background: var(--done-soft); color: var(--done); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.off { background: var(--code-bg); color: var(--muted); }
.mini { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.mini .bar { width: 70px; height: 4px; }
.who { font-size: 12px; color: var(--done); }
.expander { background: none; border: 0; padding: 0; font: inherit; font-size: 13px; color: var(--accent); cursor: pointer; }

input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--done); margin: 0; }

.change { margin-top: 6px; border-left: 2px solid var(--rule-strong); padding-left: 12px; display: grid; gap: 10px; }
.change .why { font-size: 13px; color: var(--muted); max-width: 75ch; margin: 0; }
.csec h4 { margin: 0 0 4px; font-family: var(--f-display); font-size: 15px; font-weight: 700; }
.task { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr); gap: 0 4px; padding: 4px 0; font-size: 14px; border-top: 1px dashed var(--rule); }
.task:first-of-type { border-top: 0; }
.task .tn { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.task input { margin-top: 2px; width: 16px; height: 16px; }
.task.is-done .tt { color: var(--muted); }
.task .tt { overflow-wrap: anywhere; display: grid; gap: 2px; }
.empty { padding: 14px; color: var(--muted); font-size: 14px; }
footer { font-size: 13px; color: var(--muted); max-width: 75ch; }
@media (max-width: 520px) {
  .step { grid-template-columns: 50px 26px minmax(0, 1fr); }
  .step .num { padding-left: 8px; font-size: 12px; }
  h1 { font-size: 28px; }
}
/* Выбранный вариант А: вехи внутри change, спокойная ведомость и видимые условия. */
:root { __LIGHT_THEME__ }
:root[data-theme="dark"] { __DARK_THEME__ }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { __DARK_THEME__ } }
body { margin: 0; font-family: "Roboto", "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 1280px; gap: 24px; }
h1 { font-weight: 400; font-size: 32px; }
h1, h2, h3, h4 { font-family: inherit; letter-spacing: normal; }
.lead { max-width: 95ch; }
.track-card { border-radius: 16px; padding: 20px 24px; }
.toolbar { position: static; border: 0; }
.toolbar input[type=search] { border-radius: 28px; padding: 14px 20px; border: 1px solid var(--rule); }
.seg { border: 0; border-radius: 0; gap: 8px; flex-wrap: wrap; overflow: visible; }
.seg button { border: 1px solid var(--rule-strong); border-radius: 8px; padding: 8px 14px; }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn { border-radius: 24px; padding: 8px 16px; }
main { display: grid; gap: 32px; }
.sheet { border-radius: 16px; border-color: var(--rule); }
.group-h { padding: 16px 24px; border-color: var(--rule); }
.group + .group .group-h { border-color: var(--rule); }
.step { grid-template-columns: 64px 28px minmax(0, 1fr); }
.step .body { padding: 18px 24px 22px 8px; gap: 10px; }
.step .num { border: 0; padding-top: 20px; }
.step .chk { padding-top: 20px; }
.cname .ctitle { font-size: 18px; font-weight: 500; }
.step.is-done .cname .ctitle { color: var(--ink); }
.main, .why { font-size: 13px; color: var(--muted); margin: 0; max-width: 100ch; }
.pill { font-family: inherit; text-transform: none; font-size: 13px; letter-spacing: normal; padding: 0; background: transparent !important; }
.pill.ready { color: var(--accent); }
.milestones { display: grid; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.milestones:empty { display: none; }
.milestone { padding: 20px 24px; min-width: 0; }
.milestone + .milestone { border-top: 1px solid var(--rule); }
.milestone-head, .milestone-head > div { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.milestone-head { justify-content: space-between; }
.milestone-head h3 { font-size: 18px; font-weight: 500; }
.pr-number { font-size: 13px; color: var(--muted); white-space: nowrap; }
.milestone .meta { margin-top: 10px; }
.conditions { margin-top: 18px; font-size: 14px; }
.conditions h4 { margin: 0 0 10px; font-weight: 500; font-size: 14px; }
.conditions ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.condition-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.condition-state { white-space: nowrap; color: var(--muted); font-size: 13px; }
.condition-state.is-ok { color: var(--done); }
.condition-state.is-waiting { color: var(--warn); }
.condition-source { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin: 4px 0; }
.conditions .linkbtn { font-size: 13px; padding: 4px 0; }
.milestone-note { background: var(--paper); padding: 12px 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin: 12px 0; }
.task-list { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 12px; }
.task-list summary { color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 0; }
.task-list summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.task-list .task { margin-top: 12px; }
.task .tt { display: block; }
.task .who { display: block; margin-top: 4px; color: var(--muted); }
.who { color: var(--muted); }
.completed-conditions { margin: 12px 0; }
.completed-conditions summary, .why summary { cursor: pointer; padding: 4px 0; color: var(--muted); font-size: 13px; }
.completed-conditions[open] ul { margin-top: 12px; }
.why p { line-height: 1.6; }
@media (max-width: 640px) {
  .step { grid-template-columns: 24px minmax(0, 1fr); }
  .step .body { grid-column: 2; grid-row: 2; padding: 8px 12px 18px 6px; }
  .step .num { grid-column: 2; grid-row: 1; padding: 12px 0 0 6px; font-size: 11px; }
  .step .chk { grid-column: 1; grid-row: 1 / span 2; padding: 14px 0 0 4px; }
  .milestone { padding: 16px 12px; }
  .group-h { padding: 14px 16px; }
  .condition-head { display: grid; gap: 3px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">BHS.CRG · OpenSpec · openspec/changes</div>
    <h1>__TITLE__</h1>
    <p class="lead">__LEAD__</p>
  </header>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Поиск: change, метка __EXAMPLE__, файл…" aria-label="Поиск по шагам и задачам">
    <div class="seg" role="group" aria-label="Что показывать">
      <button type="button" id="f-all" aria-pressed="true">Все шаги</button>
      <button type="button" id="f-open" aria-pressed="false">Невыполненные</button>
      <button type="button" id="f-ready" aria-pressed="false">Можно начать</button>
      <button type="button" id="f-waiting" aria-pressed="false">Ожидают</button>
    </div>
    <button type="button" class="btn" id="collapse">Свернуть задачи</button>
  </div>

  <main id="tracks"></main>

  <footer id="foot"></footer>
</div>

<script type="application/json" id="data">__ROADMAP_DATA__</script>
<script>
__ROADMAP_SCRIPT__
</script>
</body>
</html>
