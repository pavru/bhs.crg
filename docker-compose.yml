# Дев-стенд. Версии прибиты точно (issue #878): стенд, отстающий от продакшна по версии базы или
# хранилища, проверяет не то. Обновляются одним PR Dependabot'а.
#
# ⚠️ ХРАНИЛИЩЕ ЗДЕСЬ — GARAGE, А В ПОСТАВКЕ ПОКА MINIO. Это переходное состояние первого этапа
# issue #885: сначала Garage обкатывается на дев-стенде и в живых прогонах CI, и только потом,
# вторым этапом, на него переводится поставка — вместе с миграцией данных внутри `update.sh`.
# Пока состояние переходное, сторож версий в CI сверяет с поставкой только базу.
#
# ⚠️ БАЗА ЗДЕСЬ — В КОНТЕЙНЕРЕ, и это единственный поддерживаемый способ (issue #894). Раньше на
# машине автора работала нативная служба Windows, а контейнер простаивал; расхождение с поставкой
# означало, что смена мажора, раскладки тома или параметров образа на стенде не проявлялась вовсе.
#
# ПОРТ 5433, А НЕ 5432 — НАРОЧНО. На машине разработчика может стоять нативный PostgreSQL, и он
# занимает 5432. Совпадение портов не просто мешало бы запуску: строка подключения у обоих
# одинакова, поэтому приложение молча ушло бы в ТУ базу, которая успела занять порт, — а выглядело
# бы это как «данные пропали». Разные порты делают выбор явным. 5433 указан ВЕЗДЕ: здесь, в
# appsettings.Development.json, в IntegrationTestFixture и в ci.yml.
#
# Что изменилось для разработчика: хранилище слушает 3900, а не 9000, и ключи не `minioadmin`
# (Garage требует ключ вида GK+24 hex). Дев-значения проставлены в `appsettings.Development.json`,
# отдельно ничего задавать не нужно. Старый том `minio_data` осиротеет — снести его можно так:
# `docker volume rm bhscrg_minio_data` (файлов для разработки не жалко).

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bhs_crg
      POSTGRES_USER: postgres
      # ⚠️ Пароль СОВПАДАЕТ с тем, что ждут приложение и тесты: `appsettings.Development.json`,
      # `IntegrationTestFixture` и сервисный контейнер базы в ci.yml — все прибиты к
      # postgres/xxsystem. Пока базой на стенде была нативная служба, здесь стояло «postgres», и
      # расхождение никого не трогало: контейнер просто не использовали. Стоило начать (issue #894)
      # — и он не принял бы ни приложение, ни тесты, причём с сообщением про аутентификацию, по
      # которому причину ищут где угодно, кроме этого файла.
      #
      # ⚠️ ЭТО ЗНАЧЕНИЕ ЧИТАЕТСЯ ТОЛЬКО ПРИ СОЗДАНИИ ТОМА. У кого том остался с прежним паролем,
      # контейнер продолжит принимать СТАРЫЙ — со всё тем же «password authentication failed for
      # user postgres», по которому в этот файл никто не заглянет. Лечится пересозданием тома
      # (данных для разработки в нём не жалко):
      #     docker compose down && docker volume rm bhscrg_postgres_data && docker compose up -d
      POSTGRES_PASSWORD: xxsystem
    ports:
      - "5433:5432"
    volumes:
      # Путь — как в поставке (issue #880): с 18-й версии образ хранит кластер в подкаталоге с
      # номером мажора и объявляет томом /var/lib/postgresql. Имя тома прежнее — тогда старый
      # кластер 16 даёт ГРОМКИЙ отказ старта, а не тихую пустую базу. Если у вас такой том
      # остался: docker volume rm bhscrg_postgres_data (данных для разработки в нём не жалко).
      - postgres_data:/var/lib/postgresql
    # Как в поставке, и по той же причине: без health-проверки «контейнер запущен» и «база
    # принимает соединения» — разные вещи. На первом старте initdb занимает секунды и сервер
    # успевает перезапуститься; `dotnet run` в этот промежуток падает на миграции с «Connection
    # refused», и выглядит это как поломка приложения.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bhs_crg"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Нативная служба, которую этот контейнер заменил, поднималась после перезагрузки сама. База,
    # которая этого не делает, — шаг назад, а не ближе к продакшну.
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    # Образ без ENTRYPOINT: команду пишем полным путём, иначе docker ищет «server» в $PATH.
    command: ["/garage", "server"]
    environment:
      # На дев-стенде секреты фиксированы и лежат в открытую намеренно: стенд одноразовый, а
      # плавающие значения означали бы, что после каждого пересоздания надо куда-то лезть.
      GARAGE_RPC_SECRET: 6465765f6f6e6c795f7270635f7365637265745f6e6f745f666f725f6465706c
      GARAGE_ADMIN_TOKEN: dev-only-admin-token
    ports:
      - "3900:3900"
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # Форма CMD, а не CMD-SHELL: в образе Garage нет shell, и `CMD-SHELL` там просто не выполнится.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Одноразовый сервис: раскладка, ключ, бакет, права. Идемпотентен — на настроенном хранилище
  # ничего не делает. Почему отдельный образ, а не команда в compose, объяснено в его Dockerfile:
  # в образе Garage нет shell.
  # ⚠️ ПОДНИМАТЬ СТЕНД НАДО ТАК:
  #
  #     docker compose up -d && docker compose wait garage-init
  #
  # Потому что `docker compose up -d` возвращает 0 ДАЖЕ КОГДА ЭТА ИНИЦИАЛИЗАЦИЯ УПАЛА — проверено:
  # битый ключ, init выходит с кодом 1, `up -d` отвечает 0. Дальше человек получает не отказ, а
  # загадку: первая же загрузка файла падает внутри приложения ошибкой S3, которая не называет ни
  # бакета, ни причины (а `MakeBucket` тут ещё и запрещён ключу — см. ниже).
  #
  # `up -d --wait` для этого НЕ ГОДИТСЯ, хотя выглядит подходящим: одноразовый контейнер он считает
  # неуспешным ожиданием и возвращает 1 даже при коде выхода 0 (проверено). А `compose wait` отдаёт
  # ровно код init: 0 при успехе, 1 при отказе.
  garage-init:
    build:
      context: ./deploy
      dockerfile: Dockerfile.garage-init
    # Не просто `- garage`: тот означает «контейнер запущен», а инициализации нужно «RPC отвечает».
    # Ожидание внутри скрипта остаётся — оно страхует от медленной машины, — но начинать гонку с
    # ещё не поднявшимся узлом незачем.
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: 6465765f6f6e6c795f7270635f7365637265745f6e6f745f666f725f6465706c
      GARAGE_BUCKET: bhs-crg
      GARAGE_KEY_ID: GK0123456789abcdef01234567
      GARAGE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      # Том метаданных нужен клиенту не «на всякий случай»: в нём лежит ключ узла, без которого
      # CLI не подключится к серверу даже по правильному адресу (проверено на стенде).
      - garage_meta:/var/lib/garage/meta
    restart: "no"

volumes:
  postgres_data:
  garage_meta:
  garage_data:
