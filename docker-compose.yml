# Версии — те же и прибиты так же, как в поставке (issue #878): дев-стенд, отстающий от продакшна
# по версии хранилища или базы, проверяет не то. Обновляются вместе, одним PR Dependabot'а.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bhs_crg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Путь — как в поставке (issue #880): с 18-й версии образ хранит кластер в подкаталоге с
      # номером мажора и объявляет томом /var/lib/postgresql. Имя тома прежнее — тогда старый
      # кластер 16 даёт ГРОМКИЙ отказ старта, а не тихую пустую базу. Если у вас такой том
      # остался: docker volume rm bhscrg_postgres_data (данных для разработки в нём не жалко).
      - postgres_data:/var/lib/postgresql

  minio:
    # Копия образа в нашем GHCR, не оригинал с Hub: репозиторий `minio/minio` архивирован
    # (issue #882). Подробности — в `deploy/docker-compose.yml`; дев-стенд тянет то же самое,
    # иначе он проверял бы не тот образ, что поедет в поставку.
    image: ghcr.io/pavru/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
