# Версии — те же и прибиты так же, как в поставке (issue #878): дев-стенд, отстающий от продакшна
# по версии хранилища или базы, проверяет не то. Обновляются вместе, одним PR Dependabot'а.

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: bhs_crg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
