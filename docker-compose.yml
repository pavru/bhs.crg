# Версии — те же и прибиты так же, как в поставке (issue #878): дев-стенд, отстающий от продакшна
# по версии хранилища или базы, проверяет не то. Обновляются вместе, одним PR Dependabot'а.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bhs_crg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Путь и имя тома — как в поставке (issue #880): с 18-й версии образ хранит кластер в
      # подкаталоге с номером мажора и объявляет томом /var/lib/postgresql. По старому пути
      # контейнер не стартует вовсе.
      - postgres_data_18:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data_18:
  minio_data:
