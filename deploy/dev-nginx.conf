# ── Дев-стенд: единственный вход с TLS (issue #940) ─────────────────────────────────────────────
# Этот файл — ТОЛЬКО для стенда разработчика. В поставке раздачей занимается образ web
# (deploy/nginx.conf), а TLS терминирует nginx на хосте (deploy/reverse-proxy.conf.example).
#
# Приложение на стенде запускается НЕ в контейнере: API слушает 5000, дев-сервер клиента — 5173,
# и оба продолжают работать напрямую. Этот nginx ставится перед ними, чтобы стенд отвечал по HTTPS
# на одном адресе — как продакшн. Без этого не проверить ничего, что браузер разрешает только в
# защищённом контексте (камера, геолокация, service worker, установка как приложение), и не увидеть
# заголовков, которые приложение получает из-за прокси.
#
# ⚠️ Оба потребителя обязаны слушать НЕ ТОЛЬКО петлю: контейнер приходит к ним снаружи, с адреса
# шлюза. Поэтому в стенде `dotnet run` поднимается на `http://+:5000`, а vite — с ключом `--host`.
# Если API или клиент запущены иначе, ответом будет 502, и причина в этом.

# Проброс WebSocket: горячая перезагрузка vite ходит по тому же адресу, что и страница (порт клиент
# берёт из адреса страницы), то есть через этот прокси. Без карты заголовок Connection пришёл бы
# постоянным «close», и HMR молча перестал бы работать — правки просто не доезжали бы в браузер.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # 8443, а не 443: образ nginx-unprivileged работает не от root и порты ниже 1024 занять не
    # может. Наружу порт публикует compose (по умолчанию 443).
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /tls/fullchain.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;

    # Обращение по HTTP на порт HTTPS: nginx отвечает кодом 497, и по умолчанию это страница с
    # непонятным «400 Bad Request». Перенаправляем — чтобы набранный руками http:// просто работал.
    error_page 497 https://$host$request_uri;

    # Не меньше, чем предел архива копии в поставке (BACKUP_MAX_ARCHIVE_MB, по умолчанию 500 МБ)
    # плюс запас на обвязку multipart. Прокси строже приложения означал бы, что предел приложения
    # недостижим, а отказ приходит HTML-страницей nginx без поля error (см. reverse-proxy.conf.example).
    client_max_body_size 600m;

    # ── Восстановление копии: отдельный блок ради времени и потока ─────────────────────────────
    # Объявлен ДО общего /api/, потому что nginx выбирает самый длинный совпавший префикс.
    location /api/backup/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # В обе стороны — как во внутреннем nginx поставки: иначе архив в гигабайты сперва целиком
        # ложится во временный каталог, и человек ждёт, не видя ни байта.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Схема: по ней приложение видит, что снаружи HTTPS, хотя пришли к нему по HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сроки по умолчанию (60 с) малы для вёрстки PDF и распознавания сканов: обрыв приходит
        # как 504 посреди работы, притом что операция продолжает выполняться.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Всё остальное — дев-серверу клиента, вместе с WebSocket горячей перезагрузки.
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сокет HMR молчит, пока правок нет. Со сроком по умолчанию nginx рвал бы его каждую
        # минуту: клиент переподключается, но в консоли копится шум, а часть правок теряется.
        proxy_read_timeout 3600s;
    }
}
