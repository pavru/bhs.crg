server {
    # 8080, а не 80: nginx работает от непривилегированного пользователя (см. Dockerfile.web).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Версию nginx в ответах не называем.
    server_tokens off;

    # ── Заголовки безопасности ──────────────────────────────────────────────────
    # Действуют на ВСЕ ответы этого сервера. add_header не наследуется в location, где есть свой
    # add_header, — в location ниже их нет, поэтому эти применяются везде.
    #
    # Политика содержимого. Две поблажки сделаны осознанно:
    #   'unsafe-eval' — вычисляемые поля и колонки считаются на клиенте через new Function
    #                   (shared/utils/computedExpression.ts). Инлайновые скрипты при этом
    #                   по-прежнему запрещены, то есть внедрённый в данные <script> не выполнится.
    #   style-src 'unsafe-inline' — React и Radix проставляют стили атрибутом, а Monaco вставляет
    #                   <style> на ходу; nonce туда не передать.
    # blob: у img/frame — предпросмотр PDF и картинок идёт через URL.createObjectURL;
    # data: у img — изображения в реквизитах хранятся как data-URI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    # HSTS. По открытому HTTP браузер этот заголовок обязан игнорировать, так что он безвреден до
    # тех пор, пока перед системой не встанет терминатор TLS, и включается сам, когда встанет.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Загрузка сканов, наборов данных, изображений.
    #
    # client_max_body_size сюда ПОДСТАВЛЯЕТСЯ при старте контейнера — см. nginx-body-size.sh,
    # который считает его из BACKUP_MAX_ARCHIVE_MB, добавляя запас на обвязку multipart. Той же
    # переменной задан предел архива у API (issue #711), поэтому звенья цепи согласованы одним
    # значением, а не двумя числами в разных файлах.
    #
    # Наибольший наш предел — архив восстановления резервной копии (issue #482). Порог здесь ниже
    # нашего сделает предел приложения недостижимым, а отказ придёт HTML-страницей nginx, в которой
    # нет поля error — клиент покажет голое сообщение axios.
    #
    # Файла нет — nginx не стартует, и это намеренно: молчаливый откат к умолчанию nginx (1 МБ)
    # означал бы, что не загружается вообще ничего, и искали бы это долго.
    include /tmp/nginx/body-size.conf;

    # REST API → бэкенд
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA — все прочие маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
