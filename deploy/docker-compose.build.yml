# Сборка api и web ИЗ ИСХОДНИКОВ вместо готовых образов из GHCR (issue #812).
#
# Штатная поставка тянет образы (docker-compose.yml), но путь «собрать самому» должен оставаться:
# он нужен разработке, проверке правки до релиза и установке без доступа к ghcr.io.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml up -d --build
#
# APP_VERSION при этом всё равно нужен — под ним соберётся локальный образ с тем же именем, так что
# `docker compose pull` потом честно заменит его на опубликованный.
#
# ⚠️ Образу api нужен ключ лицензии Six Labors (ImageSharp 4.x без него в Release не собирается).
# Он берётся из переменной окружения SIXLABORS_LICENSE_KEY той оболочки, где запущена сборка:
#
#   SIXLABORS_LICENSE_KEY=… docker compose -f … -f deploy/docker-compose.build.yml up -d --build
#
# В .env его класть не нужно: готовым образам из GHCR ключ не требуется вовсе.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      secrets:
        - sixlabors_license

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web

secrets:
  sixlabors_license:
    environment: SIXLABORS_LICENSE_KEY
