# Конфигурация хранилища Garage — одноузловая (issue #885).
#
# ПОЧЕМУ РЕГИОН `us-east-1`, а не «garage». Наш SDK (`Minio 7.0.0`) подписывает запросы регионом
# `us-east-1` и переубедить его нельзя даже наполовину: `WithRegion` на клиенте есть, но
# `MakeBucket` подписывается ОТДЕЛЬНО и этот регион игнорирует — региона ждёт аргументом
# (`WithLocation`). То есть «настроить клиента» означало бы править и `EnsureBucketAsync`.
# Хранилище объявляет себя тем регионом, которого ждёт клиент, — и приложение работает БЕЗ ЕДИНОЙ
# правки кода. Проверено пробой всех шести операций (issue #882, PoC).
#
# СЕКРЕТОВ ЗДЕСЬ НЕТ. `rpc_secret` и `admin_token` Garage читает из переменных окружения
# (`GARAGE_RPC_SECRET`, `GARAGE_ADMIN_TOKEN`) — файл конфигурации ездит в git, переменные лежат
# в `.env` рядом с остальными паролями.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# lmdb — рекомендованный движок метаданных для одного узла: без внешних зависимостей и без
# отдельного обслуживания. Блоки данных Garage сжимает zstd сам, поэтому на диске он занимает
# меньше исходного объёма (замерено: 232 МБ против 335 МБ у MinIO на тех же 319 МиБ).
db_engine = "lmdb"

# Один узел — одна копия. Значение больше единицы на одном узле не даёт ни отказоустойчивости, ни
# смысла: Garage просто не найдёт, куда положить вторую копию, и откажется применять раскладку.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Адрес, по которому узел находят: имя сервиса в сети Compose. Сюда же подключается init-сервис —
# ему, кроме адреса, нужен том метаданных (в нём лежит ключ узла), см. Dockerfile.garage-init.
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
