name: bhs-crg

# ⚠️ ВЕРСИИ СТОРОННИХ ОБРАЗОВ ПРИБИТЫ ТОЧНО (issue #878), и `latest` сюда возвращать нельзя.
#
# Причина не в свежести, а в том, что этот файл едет ВМЕСТЕ С ВЫПУСКОМ: прибитая версия делает
# смену стороннего образа событием — с датой, коммитом и откатом. С плавающим тегом новый MinIO
# приезжал в продакшн как побочный груз обновления приложения (`update.sh` зовёт `compose pull` без
# списка сервисов, то есть тянет ВСЁ), и `--rollback` его не возвращал: он откатывает APP_VERSION,
# а тег `latest` остался тем же именем.
#
# Обновляет их Dependabot — раз в неделю, отдельным PR, который проходит весь CI (включая живые
# прогоны на настоящем MinIO). ЧЕГО ОН НЕ ДЕЛАЕТ, названо в `.github/dependabot.yml`.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ⚠️ ПУТЬ монтирования сменился вместе с мажором (issue #880), а ИМЯ ТОМА — НЕТ, и это главное
    # в здешней конструкции. С 18-й версии официальный образ хранит кластер в подкаталоге с номером
    # мажора (`PGDATA=/var/lib/postgresql/18/docker`) и объявляет томом `/var/lib/postgresql`, а не
    # `/var/lib/postgresql/data`.
    #
    # Имя тома оставлено прежним НАРОЧНО — чтобы обновление, сделанное в обход процедуры, падало
    # ГРОМКО. Проверено на живых контейнерах:
    #
    #   прежний том (кластер 16) по новому пути → контейнер НЕ стартует, exit 1, с объяснением;
    #   НОВЫЙ том по новому пути               → стартует ПУСТЫМ, старых данных не видно.
    #
    # Первая редакция этой правки том переименовывала (`postgres_data_18`) — ради того, чтобы
    # прежний кластер остался страховкой. Ценой этого удобства была ровно вторая строка таблицы:
    # система поднималась пустой, приложение накатывало миграции, и человек мог начать заносить
    # данные, пока настоящие лежали в осиротевшем томе. Громкий отказ дороже удобной страховки —
    # страховкой служит ДАМП, который процедура заставляет проверить (§8.6 DEPLOYMENT.md).
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ⚠️ ХРАНИЛИЩЕ — GARAGE (issue #885). До 0.160.0 здесь был MinIO; переход делает `update.sh`,
  # перенося файлы внутри обновления (§8.7 DEPLOYMENT.md). Том прежнего хранилища
  # (`minio_data`) обновление НЕ ТРОГАЕТ — он остаётся страховкой и точкой отката.
  #
  # Почему ушли с MinIO: `minio/minio` архивирован 13.02.2026 — community-версия больше не
  # собирается и security-фиксов не получает. Копия последнего образа лежит в нашем GHCR
  # (issue #882) и остаётся там навсегда: она нужна установкам, которые придут на обновление
  # со старых версий. Удалять её нельзя, даже когда все перейдут.
  #
  # Регион `us-east-1` объявляет ХРАНИЛИЩЕ (см. garage.toml), и поэтому приложение работает без
  # единой правки кода: наш SDK подписывает запросы этим регионом и переубедить его нельзя —
  # `MakeBucket` подписывается отдельно и `WithRegion` игнорирует.
  garage:
    image: dxflrs/garage:v2.3.0
    # Образ без ENTRYPOINT: команду пишем полным путём, иначе docker ищет «server» в $PATH.
    command: ["/garage", "server"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # Наружу не публикуется НИЧЕГО: ни S3 (3900), ни admin (3903). У MinIO здесь была консоль на
    # петле — у Garage веб-консоли нет вовсе, управление идёт CLI внутри контейнера (§6).
    # Форма CMD, а не CMD-SHELL: в образе Garage нет shell.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Одноразовый сервис: раскладка, ключ, бакет, права. Идемпотентен — поднимается при каждом
  # старте стека и на настроенном хранилище ничего не делает.
  #
  # Своё изделие, а не сторонний образ: в образе Garage НЕТ shell (там один исполняемый файл), а
  # инициализация — последовательность из четырёх команд, где идентификатор узла заранее
  # неизвестен. Собирается как api и web, тем же выпуском, из deploy/Dockerfile.garage-init.
  garage-init:
    image: ghcr.io/pavru/bhs.crg-garage-init:${APP_VERSION:?APP_VERSION не задан — укажите версию в .env}
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_BUCKET: ${GARAGE_BUCKET}
      GARAGE_KEY_ID: ${GARAGE_KEY_ID}
      GARAGE_SECRET: ${GARAGE_SECRET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      # Том метаданных нужен клиенту не «на всякий случай»: в нём лежит ключ узла, без которого
      # CLI не подключится к серверу даже по правильному адресу.
      - garage_meta:/var/lib/garage/meta
    restart: "no"

  # Локальная модель распознавания сканов (опционально)
  #
  # За ПРОФИЛЕМ: по умолчанию не поднимается (issue #824). Образ с моделью — это ~6 ГБ диска и до
  # 10 ГБ памяти, и до сих пор их получала каждая установка, включая те, где распознавание идёт
  # облачным движком или не нужно вовсе. Инструкция называла Ollama опциональной, а отказаться от
  # неё можно было только правкой этого файла — который с issue #812 приезжает ассетом релиза и
  # перезаписывается при каждом обновлении.
  #
  # Включается двумя строками в .env (обе, см. .env.example):
  #   COMPOSE_PROFILES=ollama     — поднять контейнеры
  #   OLLAMA_MODEL=qwen2.5vl:7b   — какую модель качать и какой пользоваться приложению
  ollama:
    image: ollama/ollama:0.33.1
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Модель распознавания — самый прожорливый сосед по хосту. Потолок держит её в рамках, чтобы
    # распознавание одного скана не выдавило из памяти базу и сервер приложений.
    # Значение по умолчанию рассчитано на qwen2.5vl:7b; для модели крупнее поднимите его.
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-10g}

  # Одноразовый сервис: загружает модель в Ollama (тяжёлая ~6 ГБ)
  ollama-init:
    image: ollama/ollama:0.33.1
    profiles: ["ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      # `:-` обязательно: без него Compose печатает «The "OLLAMA_MODEL" variable is not set»
      # на КАЖДОЙ команде установки по умолчанию — переменная там намеренно не задана, а
      # предупреждение неотличимо от настоящей недостачи.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    entrypoint: >
      /bin/sh -c "
      if [ x$$OLLAMA_MODEL = x ]; then
      echo 'OLLAMA_MODEL в .env не задан: модель не загружена, распознавание Ollama выключено';
      exit 0; fi;
      sleep 3;
      echo 'загрузка модели '$$OLLAMA_MODEL' (может занять время)...';
      ollama pull $$OLLAMA_MODEL || echo 'не удалось загрузить модель — распознавание будет недоступно';
      "
    restart: "no"

  api:
    # Готовый образ из GHCR, версия закреплена в .env (issue #812). Не `latest`: на хосте должно
    # быть можно ответить, что именно там крутится, и вернуться на прошлую версию. Собрать из
    # исходников по-прежнему можно — docker-compose.build.yml рядом.
    image: ghcr.io/pavru/bhs.crg-api:${APP_VERSION:?APP_VERSION не задан — укажите версию в .env}
    depends_on:
      postgres:
        condition: service_healthy
      # Именно `service_completed_successfully`, а не «хранилище запущено». Разница не
      # косметическая: неинициализированный Garage отвечает отказом на КАЖДЫЙ запрос, и без этого
      # условия система поднялась бы «успешно», а первая же загрузка файла падала бы ошибкой S3,
      # которая не называет причины. Так `docker compose up -d` возвращает ненулевой код, и
      # обновление останавливается там, где ещё понятно, что случилось.
      garage-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      BlobStorage__Endpoint: "garage:3900"
      BlobStorage__AccessKey: ${GARAGE_KEY_ID}
      BlobStorage__SecretKey: ${GARAGE_SECRET}
      BlobStorage__Bucket: ${GARAGE_BUCKET}
      BlobStorage__UseSSL: "false"
      Jwt__Key: ${JWT_KEY}
      Ollama__BaseUrl: "http://ollama:11434"
      # Пусто — Ollama выключена и в приложении: движок считается включённым ровно тогда, когда у
      # него выбрана модель (EngineReadiness, #797). Без этого выключенный профиль оборачивался бы
      # предупреждением мониторинга «Ollama перестала отвечать» на каждой свежей установке — про
      # компонент, которого там нет.
      #
      # Действует, пока настройки интеграций не сохраняли в интерфейсе: сохранённое значение
      # лежит в базе, а база сильнее переменной окружения (IntegrationSettingsService.EffRec).
      # На такой установке движок выключают там же, в настройках.
      Ollama__Model: ${OLLAMA_MODEL:-}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      WebSearch__ApiKey: ${SERPER_API_KEY:-}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
      # Сети, чьему X-Forwarded-For доверяем (CIDR через запятую). Пусто — петля и частные
      # диапазоны: этого хватает, пока API виден только из сети Compose.
      ForwardedHeaders__TrustedNetworks: ${FORWARDED_TRUSTED_NETWORKS:-}
      # Публичный адрес системы — для ссылок в письмах (сброс пароля, подтверждение почты,
      # ссылка на большой комплект). Без него ссылки в письмах собрать нельзя.
      App__PublicUrl: ${APP_PUBLIC_URL:-}
      # Ключи Data Protection (шифруют токены сброса/подтверждения) — на томе, иначе токены
      # инвалидируются при пересоздании контейнера.
      DataProtection__KeysPath: "/app/dp-keys"
      # Предел размера резервной копии. Та же переменная задаёт client_max_body_size у web —
      # порог существует звеном цепи, и рассогласовать их двумя значениями нельзя (issue #711).
      Backup__MaxArchiveMb: ${BACKUP_MAX_ARCHIVE_MB:-500}
      # Каталог резервных копий на сервере (issue #831). Путь ВНУТРИ контейнера фиксирован —
      # снаружи выбирается точкой монтирования BACKUP_DIR.
      Backup__Directory: /app/backups
      Backup__KeepCount: ${BACKUP_KEEP_COUNT:-10}
    volumes:
      - dp_keys:/app/dp-keys
      # Копии — bind-mount с хоста, а НЕ именованный том: администратору нужен путь, по которому
      # копию увозят rsync-ом и подкладывают с другого сервера — переезд именно так и делается.
      # Каталог должен принадлежать пользователю app (uid 1654): Docker создаёт недостающий каталог
      # от root, и тогда сервер откажется стартовать с объяснением (см. DEPLOYMENT §4).
      - ${BACKUP_DIR:-./backups}:/app/backups
    restart: unless-stopped
    # Потолок памяти. Тяжёлые операции — вёрстка PDF и распознавание — запускает ПОЛЬЗОВАТЕЛЬ, и без
    # потолка неудачный шаблон или большой архив уводят в своп весь хост вместе с базой и хранилищем.
    # С потолком контейнер перезапустится, остальное устоит.
    # Ограничение процессора намеренно не задано: на хосте с одним ядром значение вроде `cpus: '2'`
    # отвергается Docker'ом, и поставка перестала бы подниматься. Кому нужно — добавляет `cpus`
    # рядом, зная своё железо.
    # Готов = отвечает на запросы. Проверяем /api/version: он анонимен и не ходит в базу, а до
    # первого ответа приложение всё равно не доходит — миграции применяются раньше.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-3g}

  web:
    image: ghcr.io/pavru/bhs.crg-web:${APP_VERSION:?APP_VERSION не задан — укажите версию в .env}
    depends_on:
      # Ждём готовности api, а не просто его запуска: миграции идут ДО того, как приложение начнёт
      # отвечать, и без этого условия web поднимался бы раньше — первые запросы уходили бы в 502.
      # На обновлении это выглядит как «после обновления система не работает».
      api:
        condition: service_healthy
    environment:
      # Тот же предел, что у api: из него считается client_max_body_size (deploy/nginx-body-size.sh).
      # Значение по умолчанию здесь и в скрипте одно и то же — 500.
      BACKUP_MAX_ARCHIVE_MB: ${BACKUP_MAX_ARCHIVE_MB:-500}
    ports:
      # Внутри контейнера 8080: nginx работает от непривилегированного пользователя и порт 80
      # занять не может (см. Dockerfile.web). Порт на хосте прежний.
      #
      # WEB_BIND — адрес публикации. По умолчанию все интерфейсы: без обратного прокси иначе к
      # системе было бы не подключиться вовсе. Поставив перед ней прокси с TLS (Приложение В),
      # ставят `WEB_BIND=127.0.0.1` — и порт 8080 перестаёт отвечать снаружи, оставаясь доступным
      # прокси. Переменной, а не правкой этой строки, потому что compose-файл приезжает ассетом
      # релиза и при обновлении перезаписывается: правка исчезла бы вместе с ним, открыв вход в
      # обход TLS — молча (issue #849).
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  # Том прежнего хранилища. Сервиса MinIO здесь больше нет, но том ОБЪЯВЛЕН НАРОЧНО: на
  # установках, пришедших с версий до 0.160.0, в нём лежат файлы на момент перехода — то есть
  # страховка и точка отката (`update.sh --rollback` возвращает данные именно оттуда). Убрать его
  # объявление значило бы, что `docker compose down -v` сносит эту страховку заодно со всем
  # остальным, не сказав ни слова. На свежей установке том просто создаётся пустым и не мешает.
  minio_data:
  ollama_data:
  dp_keys:
