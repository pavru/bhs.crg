name: bhs-crg

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # Только петля: консоль хранилища работает под учёткой администратора MinIO и даёт доступ
      # ко всем файлам системы в обход приложения. Снаружи — через SSH-туннель.
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # Одноразовый сервис: создаёт bucket в MinIO
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'ожидание MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      echo 'bucket готов';
      "
    restart: "no"

  # Локальная модель распознавания сканов (опционально)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Модель распознавания — самый прожорливый сосед по хосту. Потолок держит её в рамках, чтобы
    # распознавание одного скана не выдавило из памяти базу и сервер приложений.
    # Значение по умолчанию рассчитано на qwen2.5vl:7b; для модели крупнее поднимите его.
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-10g}

  # Одноразовый сервис: загружает модель в Ollama (тяжёлая ~6 ГБ)
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      echo 'загрузка модели '$$OLLAMA_MODEL' (может занять время)...';
      ollama pull $$OLLAMA_MODEL || echo 'не удалось загрузить модель — распознавание будет недоступно';
      "
    restart: "no"

  api:
    # Готовый образ из GHCR (публикуется workflow-ом release.yml по тегу vX.Y.Z).
    # Обновление = смена APP_VERSION в .env → pull → up -d (см. docs/DEPLOYMENT.md §8).
    # Сборка из исходников (dev, офлайн) — добавьте docker-compose.build.yml вторым -f.
    image: ghcr.io/pavru/bhs.crg-api:${APP_VERSION:?задайте APP_VERSION в .env — версия поставки, напр. 0.135.0}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      BlobStorage__Endpoint: "minio:9000"
      BlobStorage__AccessKey: ${MINIO_ROOT_USER}
      BlobStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      BlobStorage__Bucket: ${MINIO_BUCKET}
      BlobStorage__UseSSL: "false"
      Jwt__Key: ${JWT_KEY}
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__Model: ${OLLAMA_MODEL}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      WebSearch__ApiKey: ${SERPER_API_KEY:-}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
      # Сети, чьему X-Forwarded-For доверяем (CIDR через запятую). Пусто — петля и частные
      # диапазоны: этого хватает, пока API виден только из сети Compose.
      ForwardedHeaders__TrustedNetworks: ${FORWARDED_TRUSTED_NETWORKS:-}
      # Публичный адрес системы — для ссылок в письмах (сброс пароля, подтверждение почты,
      # ссылка на большой комплект). Без него ссылки в письмах собрать нельзя.
      App__PublicUrl: ${APP_PUBLIC_URL:-}
      # Ключи Data Protection (шифруют токены сброса/подтверждения) — на томе, иначе токены
      # инвалидируются при пересоздании контейнера.
      DataProtection__KeysPath: "/app/dp-keys"
      # Предел размера резервной копии. Та же переменная задаёт client_max_body_size у web —
      # порог существует звеном цепи, и рассогласовать их двумя значениями нельзя (issue #711).
      Backup__MaxArchiveMb: ${BACKUP_MAX_ARCHIVE_MB:-500}
    volumes:
      - dp_keys:/app/dp-keys
    restart: unless-stopped
    # Потолок памяти. Тяжёлые операции — вёрстка PDF и распознавание — запускает ПОЛЬЗОВАТЕЛЬ, и без
    # потолка неудачный шаблон или большой архив уводят в своп весь хост вместе с базой и хранилищем.
    # С потолком контейнер перезапустится, остальное устоит.
    # Ограничение процессора намеренно не задано: на хосте с одним ядром значение вроде `cpus: '2'`
    # отвергается Docker'ом, и поставка перестала бы подниматься. Кому нужно — добавляет `cpus`
    # рядом, зная своё железо.
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-3g}

  web:
    image: ghcr.io/pavru/bhs.crg-web:${APP_VERSION:?задайте APP_VERSION в .env — версия поставки, напр. 0.135.0}
    depends_on:
      - api
    environment:
      # Тот же предел, что у api: из него считается client_max_body_size (deploy/nginx-body-size.sh).
      # Значение по умолчанию здесь и в скрипте одно и то же — 500.
      BACKUP_MAX_ARCHIVE_MB: ${BACKUP_MAX_ARCHIVE_MB:-500}
    ports:
      # Внутри контейнера 8080: nginx работает от непривилегированного пользователя и порт 80
      # занять не может (см. Dockerfile.web). Порт на хосте прежний.
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  dp_keys:
