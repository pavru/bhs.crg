name: bhs-crg

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # Только петля: консоль хранилища работает под учёткой администратора MinIO и даёт доступ
      # ко всем файлам системы в обход приложения. Снаружи — через SSH-туннель.
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  # Одноразовый сервис: создаёт bucket в MinIO
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'ожидание MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      echo 'bucket готов';
      "
    restart: "no"

  # Локальная модель распознавания сканов (опционально)
  #
  # За ПРОФИЛЕМ: по умолчанию не поднимается (issue #824). Образ с моделью — это ~6 ГБ диска и до
  # 10 ГБ памяти, и до сих пор их получала каждая установка, включая те, где распознавание идёт
  # облачным движком или не нужно вовсе. Инструкция называла Ollama опциональной, а отказаться от
  # неё можно было только правкой этого файла — который с issue #812 приезжает ассетом релиза и
  # перезаписывается при каждом обновлении.
  #
  # Включается двумя строками в .env (обе, см. .env.example):
  #   COMPOSE_PROFILES=ollama     — поднять контейнеры
  #   OLLAMA_MODEL=qwen2.5vl:7b   — какую модель качать и какой пользоваться приложению
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Модель распознавания — самый прожорливый сосед по хосту. Потолок держит её в рамках, чтобы
    # распознавание одного скана не выдавило из памяти базу и сервер приложений.
    # Значение по умолчанию рассчитано на qwen2.5vl:7b; для модели крупнее поднимите его.
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-10g}

  # Одноразовый сервис: загружает модель в Ollama (тяжёлая ~6 ГБ)
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      # `:-` обязательно: без него Compose печатает «The "OLLAMA_MODEL" variable is not set»
      # на КАЖДОЙ команде установки по умолчанию — переменная там намеренно не задана, а
      # предупреждение неотличимо от настоящей недостачи.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    entrypoint: >
      /bin/sh -c "
      if [ x$$OLLAMA_MODEL = x ]; then
      echo 'OLLAMA_MODEL в .env не задан: модель не загружена, распознавание Ollama выключено';
      exit 0; fi;
      sleep 3;
      echo 'загрузка модели '$$OLLAMA_MODEL' (может занять время)...';
      ollama pull $$OLLAMA_MODEL || echo 'не удалось загрузить модель — распознавание будет недоступно';
      "
    restart: "no"

  api:
    # Готовый образ из GHCR, версия закреплена в .env (issue #812). Не `latest`: на хосте должно
    # быть можно ответить, что именно там крутится, и вернуться на прошлую версию. Собрать из
    # исходников по-прежнему можно — docker-compose.build.yml рядом.
    image: ghcr.io/pavru/bhs.crg-api:${APP_VERSION:?APP_VERSION не задан — укажите версию в .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      BlobStorage__Endpoint: "minio:9000"
      BlobStorage__AccessKey: ${MINIO_ROOT_USER}
      BlobStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      BlobStorage__Bucket: ${MINIO_BUCKET}
      BlobStorage__UseSSL: "false"
      Jwt__Key: ${JWT_KEY}
      Ollama__BaseUrl: "http://ollama:11434"
      # Пусто — Ollama выключена и в приложении: движок считается включённым ровно тогда, когда у
      # него выбрана модель (EngineReadiness, #797). Без этого выключенный профиль оборачивался бы
      # предупреждением мониторинга «Ollama перестала отвечать» на каждой свежей установке — про
      # компонент, которого там нет.
      #
      # Действует, пока настройки интеграций не сохраняли в интерфейсе: сохранённое значение
      # лежит в базе, а база сильнее переменной окружения (IntegrationSettingsService.EffRec).
      # На такой установке движок выключают там же, в настройках.
      Ollama__Model: ${OLLAMA_MODEL:-}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      WebSearch__ApiKey: ${SERPER_API_KEY:-}
      AllowedOrigins: ${ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-8080}}
      # Сети, чьему X-Forwarded-For доверяем (CIDR через запятую). Пусто — петля и частные
      # диапазоны: этого хватает, пока API виден только из сети Compose.
      ForwardedHeaders__TrustedNetworks: ${FORWARDED_TRUSTED_NETWORKS:-}
      # Публичный адрес системы — для ссылок в письмах (сброс пароля, подтверждение почты,
      # ссылка на большой комплект). Без него ссылки в письмах собрать нельзя.
      App__PublicUrl: ${APP_PUBLIC_URL:-}
      # Ключи Data Protection (шифруют токены сброса/подтверждения) — на томе, иначе токены
      # инвалидируются при пересоздании контейнера.
      DataProtection__KeysPath: "/app/dp-keys"
      # Предел размера резервной копии. Та же переменная задаёт client_max_body_size у web —
      # порог существует звеном цепи, и рассогласовать их двумя значениями нельзя (issue #711).
      Backup__MaxArchiveMb: ${BACKUP_MAX_ARCHIVE_MB:-500}
      # Каталог резервных копий на сервере (issue #831). Путь ВНУТРИ контейнера фиксирован —
      # снаружи выбирается точкой монтирования BACKUP_DIR.
      Backup__Directory: /app/backups
      Backup__KeepCount: ${BACKUP_KEEP_COUNT:-10}
    volumes:
      - dp_keys:/app/dp-keys
      # Копии — bind-mount с хоста, а НЕ именованный том: администратору нужен путь, по которому
      # копию увозят rsync-ом и подкладывают с другого сервера — переезд именно так и делается.
      # Каталог должен принадлежать пользователю app (uid 1654): Docker создаёт недостающий каталог
      # от root, и тогда сервер откажется стартовать с объяснением (см. DEPLOYMENT §4).
      - ${BACKUP_DIR:-./backups}:/app/backups
    restart: unless-stopped
    # Потолок памяти. Тяжёлые операции — вёрстка PDF и распознавание — запускает ПОЛЬЗОВАТЕЛЬ, и без
    # потолка неудачный шаблон или большой архив уводят в своп весь хост вместе с базой и хранилищем.
    # С потолком контейнер перезапустится, остальное устоит.
    # Ограничение процессора намеренно не задано: на хосте с одним ядром значение вроде `cpus: '2'`
    # отвергается Docker'ом, и поставка перестала бы подниматься. Кому нужно — добавляет `cpus`
    # рядом, зная своё железо.
    # Готов = отвечает на запросы. Проверяем /api/version: он анонимен и не ходит в базу, а до
    # первого ответа приложение всё равно не доходит — миграции применяются раньше.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-3g}

  web:
    image: ghcr.io/pavru/bhs.crg-web:${APP_VERSION:?APP_VERSION не задан — укажите версию в .env}
    depends_on:
      # Ждём готовности api, а не просто его запуска: миграции идут ДО того, как приложение начнёт
      # отвечать, и без этого условия web поднимался бы раньше — первые запросы уходили бы в 502.
      # На обновлении это выглядит как «после обновления система не работает».
      api:
        condition: service_healthy
    environment:
      # Тот же предел, что у api: из него считается client_max_body_size (deploy/nginx-body-size.sh).
      # Значение по умолчанию здесь и в скрипте одно и то же — 500.
      BACKUP_MAX_ARCHIVE_MB: ${BACKUP_MAX_ARCHIVE_MB:-500}
    ports:
      # Внутри контейнера 8080: nginx работает от непривилегированного пользователя и порт 80
      # занять не может (см. Dockerfile.web). Порт на хосте прежний.
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  dp_keys:
