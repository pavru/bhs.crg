# Проверки на каждый PR и на каждый push в master (issue #854).
#
# До этого workflow в репозитории проверяло НИЧЕГО: `release` собирал образы не глядя на тесты,
# `claude-code-review` читал диф. Единственной защитой был ручной прогон в сессии — то есть её
# отсутствие в любом PR, слитом без него.
#
# Работы идут параллельно и падают независимо: сломанный клиент не должен прятать backend и
# наоборот. Их четыре — backend, frontend, скрипт обновления и живые прогоны в браузере (#872).
#
# ВАЖНО про статус этих проверок: сами по себе они СООБЩАЮТ, а не запрещают. Пока в настройках
# репозитория не включены required status checks на master, красный прогон не мешает ни слить PR,
# ни запушить в master напрямую. Включение — действие владельца репозитория, из кода оно не
# делается; выпуск при этом прикрыт отдельно (см. проверку в release.yml).
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Новый push в тот же PR отменяет предыдущий прогон: проверять устаревший коммит незачем, а
# очередь съедает минуты. Для master отмену НЕ включаем — там каждый коммит должен быть проверен.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (сборка + тесты)
    runs-on: ubuntu-latest

    # Интеграционные тесты ходят в ЖИВОЙ Postgres: IntegrationTestFixture прибит к
    # localhost:5432 с postgres/xxsystem, имя базы берётся из BHS_TEST_DB. Базу заводить не нужно —
    # приложение мигрирует при старте, а миграция создаёт её сама. MinIO подменён фейком, Typst
    # тестам не нужен (пропусков по его отсутствию в наборе нет).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: xxsystem
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Без health-проверки шаги стартуют раньше, чем сервер примет соединение, и падает первый
        # же тест — с сообщением про соединение, а не про причину.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Кеш пакетов NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Только csproj: версии пакетов живут в них (центрального Directory.Packages.props нет).
          # Directory.Build.props намеренно не в ключе — там номер версии, он меняется почти каждым
          # PR и обнулял бы кеш на ровном месте.
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Образ сервисного контейнера вычислить из файла НЕЛЬЗЯ: блок `services:` разбирается до
      # шагов, выражений и переменных работы там нет. Поэтому версия Postgres здесь — литерал, а не
      # чтение из поставки, как у MinIO и Typst. Сторож закрывает ровно эту разницу: он падает,
      # когда литерал и `deploy/docker-compose.yml` разъехались (issue #878).
      #
      # Дублирование без сторожа стоило бы дорого и незаметно: тесты и живые прогоны шли бы на
      # одной базе, а поставка ехала бы на другой — а сортировка текста у сборок отличается, и
      # именно на порядке в этой системе ломались проверки (issue #872).
      - name: Образы инфраструктуры совпадают с поставкой
        run: |
          # Сверяем ОБРАЗ ЦЕЛИКОМ, а не версию: с issue #882 разъехаться может и реестр — копия
          # архивированного MinIO лежит в нашем GHCR, и опечатка в длинном адресе тише опечатки
          # в теге. Эталон один — deploy/docker-compose.yml, то, что реально поедет в продакшн.
          #
          # Потребителей двое: здешний сервисный контейнер базы (объявлен литералом — `services:`
          # разбирается до шагов, выражения там не работают) и дев-compose в корне. Дев-стенд,
          # отставший по версии базы или хранилища, проверяет не то, что поставляется.
          rc=0
          same() { # $1 — эталон, $2 — файл, $3 — sed-выражение, $4 — что сверяем (человеку)
            local want="$1" file="$2" expr="$3" what="$4" used found=0
            for used in $(sed -n "$expr" "$file" | sort -u); do
              found=1
              if [ "$used" != "$want" ]; then
                echo "::error::В $file объявлен $used, а эталон $what — $want. Образы разъехались"
                rc=1
              else
                echo "$file: $used — совпадает"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::В $file не нашлось образа ($what) — сверять нечего, а раньше было"
              rc=1
            fi
          }

          # ── База: эталон — поставка, потребители — здешний литерал и дев-стенд ────────────
          PG='s|^ *image: *\(postgres:[^ ]*\)$|\1|p'
          PG_WANT=$(sed -n "$PG" deploy/docker-compose.yml | head -1)
          if [ -z "$PG_WANT" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ postgres — сверять не с чем"
            rc=1
          else
            echo "поставка (postgres): $PG_WANT"
            same "$PG_WANT" .github/workflows/ci.yml "$PG" "postgres"
            same "$PG_WANT" docker-compose.yml "$PG" "postgres"
          fi

          # ── Хранилище: эталон снова поставка, а потребителей стало трое ──────────────────
          # Переход завершён (issue #885, этап 2): Garage и в поставке, и на дев-стенде. Третий
          # потребитель появился вместе с переходом — `FROM` в Dockerfile.garage-init, откуда
          # берётся бинарь CLI для инициализации. Клиент и сервер Garage обязаны быть ОДНОЙ версии,
          # и разъехаться они могут только молча.
          GG='s|^ *image: *\(dxflrs/garage:[^ ]*\)$|\1|p'
          GG_WANT=$(sed -n "$GG" deploy/docker-compose.yml | head -1)
          if [ -z "$GG_WANT" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ dxflrs/garage — сверять не с чем"
            rc=1
          else
            echo "поставка (garage): $GG_WANT"
            same "$GG_WANT" docker-compose.yml "$GG" "garage"
            same "$GG_WANT" deploy/Dockerfile.garage-init 's|^FROM \(dxflrs/garage:[^ ]*\) .*$|\1|p' "garage"
          fi

          # Копия MinIO в нашем GHCR остаётся нужной и после перехода — ею пользуется миграция на
          # установках, которые придут со старых версий. Здесь она не сверяется ни с чем (сервиса
          # больше нет), но упомянута, чтобы её не удалили как ненужную.
          exit $rc

      - name: Сборка
        working-directory: src/server
        run: dotnet build BHS.CRG.slnx -c Debug

      - name: Тесты
        working-directory: src/server
        env:
          BHS_TEST_DB: bhs_crg_ci
        run: dotnet test BHS.CRG.Tests/BHS.CRG.Tests.csproj -c Debug --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend (типы + тесты + линт)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client

    steps:
      - uses: actions/checkout@v4

      # 22, а не свежайший: ровно на этой версии собирается образ (deploy/Dockerfile.web). CI,
      # проверяющий не ту версию, что поедет в продакшн, проверяет не то.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      # Именно `-b`. Корневой tsconfig состоит из одних ссылок на проекты, и `tsc --noEmit` на нём
      # не проверяет НИЧЕГО — всегда зелёный. Эта грабля записана в CLAUDE.md.
      - name: Проверка типов
        run: npx tsc -b

      # Полная сборка, а не только типы: сломать сборщик можно и при зелёном tsc — битым импортом
      # ассета, плагином Vite, синтаксисом в vite.config. Без этого шага такое всплывало бы уже
      # внутри Release, при сборке образа, когда номер версии уже занят и переиздать его нельзя.
      - name: Сборка
        run: npm run build

      - name: Тесты
        run: npm test

      # Не «почините 137», а «не добавляйте новых»: сравнение по правилам, детали — в самом скрипте.
      - name: Линт (храповик)
        run: npm run lint:ratchet

  update-script:
    name: Скрипт обновления (логика)
    runs-on: ubuntu-latest

    # Секунды, но закрывают класс поломок, который никто не заметит: update.sh запускают раз в
    # несколько недель на чужой машине, и ошибается он молча (проверка задач полгода отвечала
    # «задач нет» всегда, откат столько же отказывал всегда). Docker и сеть здесь не нужны —
    # проверяется то, что можно спросить без них.
    steps:
      - uses: actions/checkout@v4

      - name: Проверка логики update.sh
        run: bash deploy/update.tests.sh

  e2e:
    name: Живые прогоны (браузер)
    runs-on: ubuntu-latest

    # Единственная работа, которая поднимает ПРИЛОЖЕНИЕ ЦЕЛИКОМ и смотрит на него браузером.
    # Юнит-тесты и типы её не заменяют: за девять порций линт-долга (#858) именно эти прогоны
    # нашли восемь дефектов интерфейса, невидимых для `tsc` и vitest.
    #
    # ⚠️ ЭТА РАБОТА ГЕЙТИТ ВЫПУСК. `release.yml` спрашивает у API итог ПРОГОНА ЦЕЛИКОМ
    # (`conclusion == success`) и различать работы не умеет. Значит её падение останавливает выпуск
    # — включая падение по внешней причине: образ Garage тянется с Docker Hub анонимно, Typst и
    # браузер качаются из сети. Лекарство дешёвое и его надо знать заранее: перезапустить упавшую
    # работу («Re-run failed jobs») — итог прогона пересчитается. Не молчаливое поведение: оно
    # названо здесь, в CLAUDE.md и в e2e/README.md.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: xxsystem
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Приложение поднимается на своих портах — не на 5000/5173, чтобы работа не зависела от
      # умолчаний машины разработчика и чтобы адрес в прогонах был задан явно.
      #
      # ⚠️ Имена здесь и имена, которые печатает посев, пересекаться НЕ ДОЛЖНЫ: переменная уровня
      # работы сильнее той, что шаг дописал в $GITHUB_ENV. Напечатай посев `SMOKE_BASE` — его
      # значение приняли бы, дописали и МОЛЧА проигнорировали, а прогоны пошли бы по здешнему
      # адресу. Сегодня посев печатает адреса (`SMOKE_CONSTRUCTION_ID`, `SMOKE_SET_ID`,
      # `SMOKE_INSTANCE_ID`, `SMOKE_COPY_TARGET_SET_ID`) и имена для точного поиска
      # (`SMOKE_UNION_TYPE`, `SMOKE_WORKS_UNION_TYPE`, `SMOKE_MATERIALS_UNION_TYPE`,
      # `SMOKE_DATASET_FILE`, `SMOKE_MATERIALS_DOC`) — список растёт с каждым прогоном, который
      # сюда переезжает.
      SMOKE_BASE: http://localhost:4173

      # ПУСТАЯ строка — заявление этого окружения о себе: набора с РАСПОЗНАННЫМИ страницами здесь
      # нет и не будет, потому что распознаёт их ИИ-движок. `dialogs-smoke`, увидев пустое
      # значение, пропускает три проверки разбиения PDF и называет их в итоге — 10 из 13.
      #
      # Стоит это ЗДЕСЬ, а не в посеве, ровно по правилу выше: переменная уровня работы сильнее
      # дописанной в $GITHUB_ENV. Напечатай то же самое посев — значение приняли бы и молча
      # проигнорировали, случись когда-нибудь строка и тут. Один факт — одно место; к тому же
      # «чего не умеет окружение» это свойство работы, а не данных.
      #
      # Без него прогон взял бы своё умолчание — идентификатор набора из рабочей базы автора — и
      # три проверки падали бы «страница не открылась», показывая на компонент вместо
      # отсутствующего распознавания.
      SMOKE_PDF_FILE_ID: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      # Хранилище поднимаем шагами, а не сервисом: сервисам GitHub нельзя передать аргументы команды,
      # а Garage без них не стартует — и, в отличие от MinIO, его ещё надо ИНИЦИАЛИЗИРОВАТЬ.
      #
      # Образ ЧИТАЕМ из docker-compose.yml дев-стенда целиком — вместе с реестром, а не одну версию,
      # и тем же приёмом, что версию Typst ниже. Причина та же: прогоны обязаны идти на том
      # хранилище, что стоит у разработчика. Раньше тег не указывался вовсе, то есть бралось
      # `latest`, и разойтись эти два хранилища могли только молча (issue #878).
      #
      # Читаем из ПОСТАВКИ: прогоны обязаны идти на том хранилище, что поедет в продакшн. На первом
      # этапе issue #885 источником временно был дев-compose — поставка тогда ещё стояла на MinIO;
      # со вторым этапом обе снова сошлись, и сверяет их сторож в работе backend.
      - name: Хранилище Garage
        run: |
          GARAGE_IMAGE=$(sed -n 's|^ *image: *\(dxflrs/garage:[^ ]*\)$|\1|p' deploy/docker-compose.yml | head -1)
          if [ -z "$GARAGE_IMAGE" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ хранилища (dxflrs/garage:…) — брать неоткуда"
            exit 1
          fi
          echo "образ хранилища из поставки: $GARAGE_IMAGE"

          # Конфигурация — та же, что у дев-стенда и (со второго этапа) у поставки. Правим одно:
          # rpc_public_addr, потому что здесь узел зовут не «garage», а по петле.
          sed 's|^rpc_public_addr = .*|rpc_public_addr = "127.0.0.1:3901"|' deploy/garage.toml > /tmp/garage.toml

          docker run -d --name garage --network host \
            -e GARAGE_RPC_SECRET=6465765f6f6e6c795f7270635f7365637265745f6e6f745f666f725f6465706c \
            -e GARAGE_ADMIN_TOKEN=ci-only-admin-token \
            -v /tmp/garage.toml:/etc/garage.toml:ro \
            -v garage_meta:/var/lib/garage/meta \
            -v garage_data:/var/lib/garage/data \
            "$GARAGE_IMAGE" /garage server

          # Инициализация — ТЕМ ЖЕ скриптом, что поднимает дев-стенд и поедет в поставку. Повторить
          # его команды здесь отдельно значило бы проверять не то, что работает у людей: разойдясь,
          # два списка команд не сказали бы об этом никак.
          docker build -f deploy/Dockerfile.garage-init -t garage-init deploy
          docker run --rm --network host \
            -e GARAGE_RPC_SECRET=6465765f6f6e6c795f7270635f7365637265745f6e6f745f666f725f6465706c \
            -e GARAGE_BUCKET=bhs-crg-e2e \
            -e GARAGE_KEY_ID=GK0123456789abcdef01234567 \
            -e GARAGE_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -v /tmp/garage.toml:/etc/garage.toml:ro \
            -v garage_meta:/var/lib/garage/meta \
            garage-init

      # Проверка Typst-блоков в редакторе типов зовёт компилятор на сервере. Без него эндпоинт
      # отвечает ошибкой, и проверка краснеет — не из-за регресса, а из-за отсутствия бинаря.
      #
      # Версию ЧИТАЕМ из deploy/Dockerfile.api, а не дублируем числом. Два независимых литерала
      # разъезжаются молча: подняли версию в образе — CI продолжил бы проверять блоки прежним
      # Typst, и шаблон с новым синтаксисом зеленел бы здесь и падал в поставке (а убранный
      # синтаксис — наоборот). Проверять надо ТЕМ ЖЕ компилятором, что поедет в продакшн.
      - name: Typst CLI
        run: |
          TYPST_VERSION=$(sed -n 's/^ARG TYPST_VERSION=//p' deploy/Dockerfile.api | head -1)
          if [ -z "$TYPST_VERSION" ]; then
            echo "::error::В deploy/Dockerfile.api не нашлась строка ARG TYPST_VERSION= — версию Typst взять неоткуда"
            exit 1
          fi
          echo "версия из образа API: $TYPST_VERSION"
          curl -fsSL --retry 3 --retry-delay 2 "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst
          typst --version

      - name: Кеш пакетов NuGet
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
          path: ~/.nuget/packages

      - name: Сборка сервера
        run: dotnet publish src/server/BHS.CRG.Api -c Release -o ${{ runner.temp }}/api

      - name: Установка зависимостей клиента
        working-directory: src/client
        run: npm ci

      # Playwright ставится ТОЛЬКО здесь и БЕЗ записи в package.json (`--no-save`): остальным
      # работам он не нужен, а в общем package-lock он утяжелял бы каждую из них.
      - name: Playwright и браузер
        working-directory: src/client
        run: |
          npm i --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Сборка клиента
        working-directory: src/client
        run: npm run build

      # Запускаем ИЗ каталога публикации. Запуск по полному пути к dll оставляет корнем содержимого
      # текущий каталог — приложение не находит свой appsettings.json, поднимается на умолчаниях и
      # выпускает токены без `aud`. Снаружи это выглядит как «прогоны не могут войти», и на поиск
      # настоящей причины уходит час (проверено).
      - name: Запуск сервера
        working-directory: ${{ runner.temp }}/api
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5055
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=bhs_crg_e2e;Username=postgres;Password=xxsystem
          # Ключ подписи — одноразовый и живёт ровно столько, сколько работа. Секретом он не
          # является: база и адрес существуют только внутри этого прогона.
          Jwt__Key: ci-only-signing-key-for-live-smokes-not-a-secret
          # Ключи Garage: формат жёсткий (GK + 24 hex у идентификатора, 64 hex у секрета), поэтому
          # прежние «minioadmin» не годятся. Значения те же, что у дев-стенда, и секретом не
          # являются — хранилище живёт внутри прогона.
          BlobStorage__Endpoint: 127.0.0.1:3900
          BlobStorage__AccessKey: GK0123456789abcdef01234567
          BlobStorage__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BlobStorage__Bucket: bhs-crg-e2e
          AllowedOrigins: http://localhost:4173
          App__PublicUrl: http://localhost:4173
          TYPST_PATH: /usr/local/bin/typst
        run: |
          nohup dotnet ./BHS.CRG.Api.dll > ${{ runner.temp }}/api.log 2>&1 &
          echo "сервер запущен, ждём в шаге посева"

      # Посев ждёт готовности сервера сам и печатает переменные прогонов — их кладём в окружение
      # работы. Данные синтетические: репозиторий публичный, дамп рабочей базы сюда нельзя.
      - name: Посев данных
        working-directory: src/client
        env:
          SEED_API: http://localhost:5055
        run: |
          # pipefail обязателен: код возврата конвейера — это код `tee`, то есть НОЛЬ. Без него
          # упавший посев проходит молча, и работа краснеет позже и не там (или зеленеет на
          # полупустой базе, где проверки сообщают «проверять нечего»).
          set -o pipefail
          node e2e/seed.mjs | tee ${{ runner.temp }}/seed.out
          grep '^SMOKE_' ${{ runner.temp }}/seed.out >> "$GITHUB_ENV"

      # Прогоны идут по СОБРАННОМУ клиенту, а не по dev-серверу: проверять надо то, что поедет
      # в продакшн. Прокси на API у preview свой — адрес берётся из API_TARGET.
      - name: Запуск клиента
        working-directory: src/client
        env:
          API_TARGET: http://localhost:5055
        run: |
          nohup npx vite preview --port 4173 --strictPort > ${{ runner.temp }}/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then echo "клиент отвечает"; exit 0; fi
            sleep 2
          done
          echo "клиент не поднялся за минуту"; cat ${{ runner.temp }}/web.log; exit 1

      - name: Живые прогоны
        working-directory: src/client
        run: npm run test:e2e:ci

      # Разбирать красный прогон по одной строке «✗ …» невозможно: причина обычно в логе сервера.
      - name: Логи при провале
        if: failure()
        run: |
          echo '── сервер ──'; tail -n 200 ${{ runner.temp }}/api.log || true
          echo '── клиент ──'; tail -n 50 ${{ runner.temp }}/web.log || true
          # Хранилище тоже: когда падает оно, инициализация сообщает лишь «узел не ответил», а
          # причина (порт занят, битый конфиг, нехватка места) видна только здесь.
          echo '── хранилище ──'; docker logs --tail 50 garage 2>&1 || true
