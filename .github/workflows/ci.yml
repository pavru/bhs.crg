# Проверки на каждый PR и на каждый push в master (issue #854).
#
# До этого workflow в репозитории проверяло НИЧЕГО: `release` собирал образы не глядя на тесты,
# `claude-code-review` читал диф. Единственной защитой был ручной прогон в сессии — то есть её
# отсутствие в любом PR, слитом без него.
#
# Работы идут параллельно и падают независимо: сломанный клиент не должен прятать backend и
# наоборот. Их четыре — backend, frontend, скрипт обновления и живые прогоны в браузере (#872).
#
# ВАЖНО про статус этих проверок. Три из них ОБЯЗАТЕЛЬНЫ: «Backend (сборка + тесты)», «Frontend
# (типы + тесты + линт)» и «Скрипт обновления (логика)» перечислены в наборе правил репозитория
# (Settings → Rules → «Master ruleset»), и пока они не зелёные, PR в master не сливается. Живые
# прогоны и claude-review обязательными не сделаны — они сообщают.
#
# ⚠️ Отсюда следует то, что легко забыть: ИМЕНА ЭТИХ ТРЁХ РАБОТ МЕНЯТЬ НЕЛЬЗЯ — правило ждёт
# проверку по имени, и переименование блокирует слияние навсегда (см. комментарий у самой работы).
#
# Выпуск прикрыт отдельно: release.yml спрашивает у API итог прогона CI на своём коммите.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Новый push в тот же PR отменяет предыдущий прогон: проверять устаревший коммит незачем, а
# очередь съедает минуты. Для master отмену НЕ включаем — там каждый коммит должен быть проверен.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (сборка + тесты)
    runs-on: ubuntu-latest

    # Интеграционные тесты ходят в ЖИВОЙ Postgres: IntegrationTestFixture прибит к
    # 127.0.0.1:5433 с postgres/xxsystem, имя базы берётся из BHS_TEST_DB. Порт 5433, а не 5432 —
    # см. комментарий у фикстуры: на машине разработчика 5432 занимает нативная служба, и значение
    # держится одно на все окружения, чтобы «локально прошло, в CI упало» не случалось из-за порта. Базу заводить не нужно —
    # приложение мигрирует при старте, а миграция создаёт её сама. MinIO подменён фейком, Typst
    # тестам не нужен (пропусков по его отсутствию в наборе нет).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: xxsystem
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Сервер тестов не бережёт данные от сбоя питания (issue #1164): база живёт три минуты и
          # нужна только этому прогону. Ради скорости одного потока это ничего не даёт (259 с против
          # 251), а двум потокам — половину времени: 212 с против 134. Тесты переписи миграций и
          # хосты модулей создают и сносят базы, каждое такое действие требует контрольной точки, а
          # она обязана сбросить на диск каждый файл, заведённый очистками соседнего потока.
          #
          # Аргументами initdb, а не командой сервера: сервисам GitHub команду не передать. Только
          # ЗДЕСЬ, не в работе живых прогонов и не на стенде: там база либо проверяет поставку,
          # либо хранит данные разработчика.
          POSTGRES_INITDB_ARGS: "-c fsync=off -c synchronous_commit=off -c full_page_writes=off"
        ports:
          - 5433:5432
        # Без health-проверки шаги стартуют раньше, чем сервер примет соединение, и падает первый
        # же тест — с сообщением про соединение, а не про причину.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Кеш пакетов NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          # Только csproj: версии пакетов живут в них (центрального Directory.Packages.props нет).
          # Directory.Build.props намеренно не в ключе — там номер версии, он меняется каждым
          # слиянием и обнулял бы кеш на ровном месте.
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Образ сервисного контейнера вычислить из файла НЕЛЬЗЯ: блок `services:` разбирается до
      # шагов, выражений и переменных работы там нет. Поэтому версия Postgres здесь — литерал, а не
      # чтение из поставки, как у MinIO и Typst. Сторож закрывает ровно эту разницу: он падает,
      # когда литерал и `deploy/docker-compose.yml` разъехались (issue #878).
      #
      # Дублирование без сторожа стоило бы дорого и незаметно: тесты и живые прогоны шли бы на
      # одной базе, а поставка ехала бы на другой — а сортировка текста у сборок отличается, и
      # именно на порядке в этой системе ломались проверки (issue #872).
      - name: Образы инфраструктуры совпадают с поставкой
        run: |
          # Сверяем ОБРАЗ ЦЕЛИКОМ, а не версию: с issue #882 разъехаться может и реестр — копия
          # архивированного MinIO лежит в нашем GHCR, и опечатка в длинном адресе тише опечатки
          # в теге. Эталон один — deploy/docker-compose.yml, то, что реально поедет в продакшн.
          #
          # Потребителей двое: здешний сервисный контейнер базы (объявлен литералом — `services:`
          # разбирается до шагов, выражения там не работают) и дев-compose в корне. Дев-стенд,
          # отставший по версии базы или хранилища, проверяет не то, что поставляется.
          rc=0
          same() { # $1 — эталон, $2 — файл, $3 — sed-выражение, $4 — что сверяем (человеку)
            local want="$1" file="$2" expr="$3" what="$4" used found=0
            # shellcheck disable=SC2013 # имя образа пробелов не содержит, разбиение по словам и нужно
            for used in $(sed -n "$expr" "$file" | sort -u); do
              found=1
              if [ "$used" != "$want" ]; then
                echo "::error::В $file объявлен $used, а эталон $what — $want. Образы разъехались"
                rc=1
              else
                echo "$file: $used — совпадает"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::В $file не нашлось образа ($what) — сверять нечего, а раньше было"
              rc=1
            fi
          }

          # ── База: эталон — поставка, потребители — здешний литерал и дев-стенд ────────────
          PG='s|^ *image: *\(postgres:[^ ]*\)$|\1|p'
          PG_WANT=$(sed -n "$PG" deploy/docker-compose.yml | head -1)
          if [ -z "$PG_WANT" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ postgres — сверять не с чем"
            rc=1
          else
            echo "поставка (postgres): $PG_WANT"
            same "$PG_WANT" .github/workflows/ci.yml "$PG" "postgres"
            same "$PG_WANT" docker-compose.yml "$PG" "postgres"
          fi

          # ── Хранилище: эталон снова поставка, а потребителей стало трое ──────────────────
          # Переход завершён (issue #885, этап 2): Garage и в поставке, и на дев-стенде. Третий
          # потребитель появился вместе с переходом — `FROM` в Dockerfile.garage-init, откуда
          # берётся бинарь CLI для инициализации. Клиент и сервер Garage обязаны быть ОДНОЙ версии,
          # и разъехаться они могут только молча.
          GG='s|^ *image: *\(dxflrs/garage:[^ ]*\)$|\1|p'
          GG_WANT=$(sed -n "$GG" deploy/docker-compose.yml | head -1)
          if [ -z "$GG_WANT" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ dxflrs/garage — сверять не с чем"
            rc=1
          else
            echo "поставка (garage): $GG_WANT"
            same "$GG_WANT" docker-compose.yml "$GG" "garage"
            same "$GG_WANT" deploy/Dockerfile.garage-init 's|^FROM \(dxflrs/garage:[^ ]*\) .*$|\1|p' "garage"
          fi

          # ── Обратный прокси стенда: эталон — образ, на котором собирается web ────────────
          # На стенде nginx стоит перед приложением и даёт ему HTTPS (issue #940). Своего образа у
          # него нет: берётся тот же, на котором в поставке собирается web, — стенд, отставший по
          # версии прокси, проверяет не то, что поедет заказчику. Эталон здесь не
          # deploy/docker-compose.yml (там образ наш, из GHCR), а `FROM` в Dockerfile.web.
          NG_WANT=$(sed -n 's|^FROM \(nginxinc/nginx-unprivileged:[^ ]*\).*$|\1|p' deploy/Dockerfile.web | head -1)
          if [ -z "$NG_WANT" ]; then
            echo "::error::В deploy/Dockerfile.web не нашёлся образ nginx — сверять не с чем"
            rc=1
          else
            echo "поставка (nginx): $NG_WANT"
            same "$NG_WANT" docker-compose.yml 's|^ *image: *\(nginxinc/nginx-unprivileged:[^ ]*\)$|\1|p' "nginx"
          fi

          # Копия MinIO в нашем GHCR остаётся нужной и после перехода — ею пользуется миграция на
          # установках, которые придут со старых версий. Здесь она не сверяется ни с чем (сервиса
          # больше нет), но упомянута, чтобы её не удалили как ненужную.
          exit $rc

      # Ключ лицензии Six Labors: ImageSharp 4.x проверяет его при сборке. В Debug его отсутствие —
      # предупреждение, в Release — отказ; называем и здесь, чтобы сборка была без предупреждения.
      # У PR из форка секрета нет — там эта сборка пройдёт с предупреждением.
      - name: Сборка
        working-directory: src/server
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: dotnet build BHS.CRG.slnx -c Debug

      # Двумя потоками — двумя процессами `dotnet test` на своих базах (issue #1164): интеграционные
      # тесты идут строго по очереди, и одному потоку из четырёх ядер раннера доставалось одно.
      # Как тесты делятся, почему поделить их неправильно нельзя и что печатает итог — в самом
      # скрипте; его логику проверяет работа «Скрипт обновления».
      #
      # Имена баз потоков скрипт выводит из BHS_TEST_DB: bhs_crg_ci_s1 и bhs_crg_ci_s2.
      - name: Тесты
        env:
          BHS_TEST_DB: bhs_crg_ci
        run: bash scripts/backend-tests.sh --no-build -c Debug

  frontend:
    name: Frontend (типы + тесты + линт)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22, а не свежайший: ровно на этой версии собирается образ (deploy/Dockerfile.web). CI,
      # проверяющий не ту версию, что поедет в продакшн, проверяет не то.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      # Именно `-b`. Корневой tsconfig состоит из одних ссылок на проекты, и `tsc --noEmit` на нём
      # не проверяет НИЧЕГО — всегда зелёный. Эта грабля записана в CLAUDE.md.
      - name: Проверка типов
        run: npx tsc -b

      # Полная сборка, а не только типы: сломать сборщик можно и при зелёном tsc — битым импортом
      # ассета, плагином Vite, синтаксисом в vite.config. Без этого шага такое всплывало бы уже
      # внутри Release, при сборке образа, когда номер версии уже занят и переиздать его нельзя.
      - name: Сборка
        run: npm run build

      - name: Тесты
        run: npm test

      # Не «почините 137», а «не добавляйте новых»: сравнение по правилам, детали — в самом скрипте.
      - name: Линт (храповик)
        run: npm run lint:ratchet

  update-script:
    # ⚠️ ИМЯ РАБОТЫ МЕНЯТЬ НЕЛЬЗЯ, хотя проверяются здесь уже ТРИ скрипта и имя этого не отражает.
    # Оно названо в обязательных проверках master (Settings → Rules → «Master ruleset»), и правило
    # ждёт проверку ИМЕННО с этим именем. Переименование означает, что обязательная проверка не
    # появится никогда, а слияние блокируется навсегда — с сообщением «the base branch policy
    # prohibits the merge», которое на имя не указывает ничем.
    #
    # Проверено на этом самом PR: работа была переименована в «Скрипты установки и обновления
    # (логика)», все пять проверок зелёные, а слияние отклонено. Менять имя можно только вместе с
    # правилом в настройках репозитория, и в таком порядке: сначала правило принимает новое имя,
    # потом workflow. То же верно для «Backend (сборка + тесты)» и «Frontend (типы + тесты + линт)».
    name: Скрипт обновления (логика)
    runs-on: ubuntu-latest

    # Секунды, но закрывают класс поломок, который никто не заметит: эти скрипты запускают на
    # чужой машине — update.sh раз в несколько недель, install.sh один раз, — и ошибаются они молча (проверка задач полгода отвечала
    # «задач нет» всегда, откат столько же отказывал всегда). Скриптам Docker и сеть не нужны —
    # проверяется то, что можно спросить без них. Нужны они двум шагам в конце: проверке самих
    # workflow и конвертеру офисных файлов.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверка логики update.sh
        run: bash deploy/update.tests.sh

      # Тот же довод, что и выше, только сильнее: install.sh запускают ОДИН раз на установку, и
      # ошибка в нём встречает человека, который систему ещё не видел (issue #890).
      - name: Проверка логики install.sh
        run: bash deploy/install.tests.sh

      # Скрипты версии запускает не человек, а workflow «Повышение версии» после слияния, и их
      # результат сразу уходит коммитом в master — ошибку там глазами никто не увидит (issue #1153).
      - name: Проверка логики bump-version.sh
        run: bash scripts/bump-version.tests.sh

      # Скрипт стоит между тестами backend и обязательной проверкой: ошибка в сведении двух кодов
      # возврата в один дала бы зелёный шаг при красных тестах (issue #1164). Проверяется с
      # подделкой вместо `dotnet` — ни .NET, ни база здесь не нужны.
      - name: Проверка логики backend-tests.sh
        run: bash scripts/backend-tests.tests.sh

      # Тот же довод: скрипт сводит коды возврата трёх ветвей подготовки живых прогонов в один
      # (issue #1178). Проверяется на командах оболочки.
      - name: Проверка логики in-parallel.sh
        run: bash scripts/in-parallel.tests.sh

      # Сами workflow (issue #1179). `bump-version.yml` и `release.yml` на PR не запускаются: первый
      # идёт только на push в master, второй — только вручную, и сломанный в них вызов всплыл бы
      # уже в master — красным повышением версии, после которого выпуск отказывает, — или прямо в
      # выпуске. actionlint читает все пять файлов: синтаксис, выражения (`github.actorr` — отказ)
      # и `run:` через shellcheck.
      #
      # ⚠️ ВХОДЫ ДЕЙСТВИЙ ОН НЕ СВЕРЯЕТ. Действия закреплены по SHA, а по SHA версию он не узнаёт и
      # проверку молча пропускает (проверено подсадкой: при `@v4` неизвестный вход
      # `setup-buildx-action` был отказом, при SHA — тишина). Действия Docker проверяет пробный
      # выпуск — release.yml с `dry_run`.
      #
      # Образ прибит дайджестом: проверка, которая сама приезжает по передвигаемому тегу, проверяет
      # не то, что вчера.
      - name: Проверка workflow (actionlint)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      # Конвертер офисных файлов (issue #1267) проверяется ЖИВЫМ контейнером из compose-файла
      # поставки: иначе его условия не проверить. Без русской локали сумма счёта в PDF записана
      # по-американски, без внутренней сети документ может ходить наружу — и в обоих случаях
      # сервис отвечает кодом 200. Здесь же сверяется, что дев-стенд объявляет тот же сервис: он
      # записан в двух compose-файлах, и версия образа — лишь одно из того, что обязано совпасть.
      #
      # Стоит в обязательной проверке нарочно: обновление образа приходит PR от Dependabot, и
      # красный необязательный шаг его бы не остановил.
      #
      # ⚠️ Шагу нужны Docker Hub, apt и выход на github.com из контейнера, а проверка обязательная:
      # их сбой запирал бы слияние ЛЮБОГО PR. Поэтому на PR шаг идёт, только когда тронуто то, от
      # чего зависит его ответ, — оба compose-файла, сам сторож с эталоном, вход стенда и этот
      # файл. На push в master идёт всегда: там он ничего не запирает, а пропуск был бы тишиной.
      - name: Затронут ли конвертер офисных файлов
        id: converter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin "$BASE"
          FILES="docker-compose.yml deploy/docker-compose.yml deploy/dev-nginx.conf"
          FILES="$FILES deploy/converter.tests.sh deploy/converter-reference.xlsx deploy/converter-reference.pdf"
          FILES="$FILES deploy/converter-protected.xlsx deploy/converter-protected.xls .github/workflows/ci.yml"
          # shellcheck disable=SC2086 # список путей: разбиение по словам и нужно
          touched="$(git diff --name-only "$BASE" HEAD -- $FILES)"
          if [ -n "$touched" ]; then
            echo "затронуто:"; echo "$touched"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "конвертер не затронут — живая проверка пропущена"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Конвертер офисных файлов (локаль, сеть, согласие стенда с поставкой)
        if: steps.converter.outputs.run == 'true'
        run: |
          command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          bash deploy/converter.tests.sh

  e2e:
    name: Живые прогоны (браузер)
    runs-on: ubuntu-latest

    # Единственная работа, которая поднимает ПРИЛОЖЕНИЕ ЦЕЛИКОМ и смотрит на него браузером.
    # Юнит-тесты и типы её не заменяют: за девять порций линт-долга (#858) именно эти прогоны
    # нашли восемь дефектов интерфейса, невидимых для `tsc` и vitest.
    #
    # ⚠️ ЭТА РАБОТА ГЕЙТИТ ВЫПУСК. `release.yml` спрашивает у API итог ПРОГОНА ЦЕЛИКОМ
    # (`conclusion == success`) и различать работы не умеет. Значит её падение останавливает выпуск
    # — включая падение по внешней причине: образ Garage тянется с Docker Hub анонимно, Typst и
    # браузер качаются из сети. Лекарство дешёвое и его надо знать заранее: перезапустить упавшую
    # работу («Re-run failed jobs») — итог прогона пересчитается. Не молчаливое поведение: оно
    # названо здесь, в CLAUDE.md и в e2e/README.md.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: xxsystem
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Приложение поднимается на своих портах — не на 5000/5173, чтобы работа не зависела от
      # умолчаний машины разработчика и чтобы адрес в прогонах был задан явно.
      #
      # ⚠️ Имена здесь и имена, которые печатает посев, пересекаться НЕ ДОЛЖНЫ: переменная уровня
      # работы сильнее той, что шаг дописал в $GITHUB_ENV. Напечатай посев `SMOKE_BASE` — его
      # значение приняли бы, дописали и МОЛЧА проигнорировали, а прогоны пошли бы по здешнему
      # адресу. Сегодня посев печатает адреса (`SMOKE_CONSTRUCTION_ID`, `SMOKE_SET_ID`,
      # `SMOKE_INSTANCE_ID`, `SMOKE_COPY_TARGET_SET_ID`) и имена для точного поиска
      # (`SMOKE_UNION_TYPE`, `SMOKE_WORKS_UNION_TYPE`, `SMOKE_MATERIALS_UNION_TYPE`,
      # `SMOKE_DATASET_FILE`, `SMOKE_MATERIALS_DOC`) — список растёт с каждым прогоном, который
      # сюда переезжает.
      SMOKE_BASE: http://localhost:4173

      # ПУСТАЯ строка — заявление этого окружения о себе: набора с РАСПОЗНАННЫМИ страницами здесь
      # нет и не будет, потому что распознаёт их ИИ-движок. `dialogs-smoke`, увидев пустое
      # значение, пропускает три проверки разбиения PDF и называет их в итоге — 15 из 18.
      #
      # Стоит это ЗДЕСЬ, а не в посеве, ровно по правилу выше: переменная уровня работы сильнее
      # дописанной в $GITHUB_ENV. Напечатай то же самое посев — значение приняли бы и молча
      # проигнорировали, случись когда-нибудь строка и тут. Один факт — одно место; к тому же
      # «чего не умеет окружение» это свойство работы, а не данных.
      #
      # Без него прогон взял бы своё умолчание — идентификатор набора из рабочей базы автора — и
      # три проверки падали бы «страница не открылась», показывая на компонент вместо
      # отсутствующего распознавания.
      SMOKE_PDF_FILE_ID: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      # Хранилище поднимаем шагами, а не сервисом: сервисам GitHub нельзя передать аргументы команды,
      # а Garage без них не стартует — и, в отличие от MinIO, его ещё надо ИНИЦИАЛИЗИРОВАТЬ.
      #
      # Образ ЧИТАЕМ из docker-compose.yml дев-стенда целиком — вместе с реестром, а не одну версию,
      # и тем же приёмом, что версию Typst ниже. Причина та же: прогоны обязаны идти на том
      # хранилище, что стоит у разработчика. Раньше тег не указывался вовсе, то есть бралось
      # `latest`, и разойтись эти два хранилища могли только молча (issue #878).
      #
      # Читаем из ПОСТАВКИ: прогоны обязаны идти на том хранилище, что поедет в продакшн. На первом
      # этапе issue #885 источником временно был дев-compose — поставка тогда ещё стояла на MinIO;
      # со вторым этапом обе снова сошлись, и сверяет их сторож в работе backend.
      - name: Хранилище Garage
        run: |
          GARAGE_IMAGE=$(sed -n 's|^ *image: *\(dxflrs/garage:[^ ]*\)$|\1|p' deploy/docker-compose.yml | head -1)
          if [ -z "$GARAGE_IMAGE" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ хранилища (dxflrs/garage:…) — брать неоткуда"
            exit 1
          fi
          echo "образ хранилища из поставки: $GARAGE_IMAGE"

          # Конфигурация — та же, что у дев-стенда и (со второго этапа) у поставки. Правим одно:
          # rpc_public_addr, потому что здесь узел зовут не «garage», а по петле.
          sed 's|^rpc_public_addr = .*|rpc_public_addr = "127.0.0.1:3901"|' deploy/garage.toml > /tmp/garage.toml

          docker run -d --name garage --network host \
            -e GARAGE_RPC_SECRET=6465765f6f6e6c795f7270635f7365637265745f6e6f745f666f725f6465706c \
            -e GARAGE_ADMIN_TOKEN=ci-only-admin-token \
            -v /tmp/garage.toml:/etc/garage.toml:ro \
            -v garage_meta:/var/lib/garage/meta \
            -v garage_data:/var/lib/garage/data \
            "$GARAGE_IMAGE" /garage server

          # Инициализация — ТЕМ ЖЕ скриптом, что поднимает дев-стенд и поедет в поставку. Повторить
          # его команды здесь отдельно значило бы проверять не то, что работает у людей: разойдясь,
          # два списка команд не сказали бы об этом никак.
          docker build -f deploy/Dockerfile.garage-init -t garage-init deploy
          docker run --rm --network host \
            -e GARAGE_RPC_SECRET=6465765f6f6e6c795f7270635f7365637265745f6e6f745f666f725f6465706c \
            -e GARAGE_BUCKET=bhs-crg-e2e \
            -e GARAGE_KEY_ID=GK0123456789abcdef01234567 \
            -e GARAGE_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -v /tmp/garage.toml:/etc/garage.toml:ro \
            -v garage_meta:/var/lib/garage/meta \
            garage-init

      # Конвертер офисных файлов (issue #1270): прогон счетов прикладывает Excel и ждёт рядом с
      # формой его вид для чтения. Серверные тесты ходят к подставному конвертеру — настоящий
      # встречается с приложением только здесь.
      #
      # Образ ЧИТАЕМ из поставки, как и хранилище выше. Настройки названы те, от которых зависит
      # ответ прогона: русская локаль и перезапуск после каждого документа. Остальное — сеть без
      # выхода наружу, ограничения контейнера, согласие стенда с поставкой — сторожит
      # `deploy/converter.tests.sh` в работе «Скрипт обновления»; здесь порт опубликован на петлю,
      # потому что сервер запущен на хосте.
      - name: Конвертер офисных файлов
        run: |
          CONVERTER_IMAGE=$(sed -n 's|^ *image: *\(gotenberg/gotenberg:[^ ]*\)$|\1|p' deploy/docker-compose.yml | head -1)
          if [ -z "$CONVERTER_IMAGE" ]; then
            echo "::error::В deploy/docker-compose.yml не нашёлся образ конвертера (gotenberg/gotenberg:…) — брать неоткуда"
            exit 1
          fi
          echo "конвертер: $CONVERTER_IMAGE"
          docker run -d --name converter -p 127.0.0.1:3910:3000 \
            -e LANG=ru_RU.UTF-8 -e LC_ALL=ru_RU.UTF-8 \
            "$CONVERTER_IMAGE" gotenberg --api-timeout=30s --libreoffice-restart-after=1 --libreoffice-auto-start
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3910/health >/dev/null 2>&1; then echo "конвертер готов"; exit 0; fi
            sleep 2
          done
          echo "::error::Конвертер офисных файлов не поднялся за две минуты"
          docker logs --tail 50 converter 2>&1 || true
          exit 1

      # Проверка Typst-блоков в редакторе типов зовёт компилятор на сервере. Без него эндпоинт
      # отвечает ошибкой, и проверка краснеет — не из-за регресса, а из-за отсутствия бинаря.
      #
      # Версию ЧИТАЕМ из deploy/Dockerfile.api, а не дублируем числом. Два независимых литерала
      # разъезжаются молча: подняли версию в образе — CI продолжил бы проверять блоки прежним
      # Typst, и шаблон с новым синтаксисом зеленел бы здесь и падал в поставке (а убранный
      # синтаксис — наоборот). Проверять надо ТЕМ ЖЕ компилятором, что поедет в продакшн.
      - name: Typst CLI
        run: |
          TYPST_VERSION=$(sed -n 's/^ARG TYPST_VERSION=//p' deploy/Dockerfile.api | head -1)
          if [ -z "$TYPST_VERSION" ]; then
            echo "::error::В deploy/Dockerfile.api не нашлась строка ARG TYPST_VERSION= — версию Typst взять неоткуда"
            exit 1
          fi
          echo "версия из образа API: $TYPST_VERSION"
          curl -fsSL --retry 3 --retry-delay 2 "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          sudo chmod +x /usr/local/bin/typst
          typst --version

      - name: Кеш пакетов NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
          path: ~/.nuget/packages

      # Три ветви ОДНОВРЕМЕННО (issue #1178), сводит их `scripts/in-parallel.sh` (его логику
      # проверяет работа «Скрипт обновления»). Замер и почему шаг не сжимается до самой долгой
      # ветви — docs/DEV_NOTES.md, «Живые прогоны: подготовка тремя ветвями».
      #
      # - Клиент — без проверки типов (`build:bundle`): её делает обязательная работа Frontend, а
      #   здесь однопоточный `tsc -b` был самым дорогим соседом сборки сервера.
      # - Playwright ставится ОДИН раз, в свой каталог, а не в `node_modules` клиента: тот в эту
      #   секунду пишет соседняя ветвь. Прогоны находят пакет по PLAYWRIGHT_PKG, и пакет с браузером
      #   поэтому одной версии по построению. В package.json его нет: остальным работам он не нужен.
      # - Браузер — только headless shell (`--only-shell`): обвязка запускает именно его, а полная
      #   сборка Chrome качалась зря на самой долгой ветви.
      # - Общий у ветвей только кеш npm — он рассчитан на одновременную работу.
      #
      # Срок — десять минут при обычной минуте: зависшая ветвь иначе держала бы работу шесть часов.
      #
      # ⚠️ Ключ лицензии Six Labors — этой сборке ОБЯЗАТЕЛЕН: она Release, а ImageSharp 4.x без ключа
      # в Release не собирается («No Six Labors license found»). MSBuild читает свойство из
      # переменной окружения. У PR из форка секрета нет, и живые прогоны там краснеют на сборке.
      #
      # ⚠️ Краснеет ЗДЕСЬ словами про лицензию при зелёном «Backend» — у ключа истёк срок (он вшит в
      # ключ): обновите секрет SIXLABORS_LICENSE_KEY в хранилищах Actions И Dependabot.
      #
      # ⚠️ Окружение шага достаётся всем ветвям, а две из них ставят пакеты npm, чьи установочные
      # скрипты — чужой код (в том числе из PR Dependabot). Поэтому ветви npm ключ с себя СНИМАЮТ
      # (`unset`). Новая ветвь, запускающая чужой код, обязана начинаться так же.
      - name: Сборка сервера, клиента и установка браузера
        timeout-minutes: 10
        env:
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          bash scripts/in-parallel.sh \
            'Сборка сервера' \
              'dotnet publish src/server/BHS.CRG.Api -c Release -o "$RUNNER_TEMP/api"' \
            'Сборка клиента' \
              'unset SixLaborsLicenseKey; cd src/client && npm ci && npm run build:bundle' \
            'Браузер' \
              'unset SixLaborsLicenseKey; npm i --prefix "$RUNNER_TEMP/playwright" playwright@1.62.1 && "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps --only-shell chromium'

      # Запускаем ИЗ каталога публикации. Запуск по полному пути к dll оставляет корнем содержимого
      # текущий каталог — приложение не находит свой appsettings.json, поднимается на умолчаниях и
      # выпускает токены без `aud`. Снаружи это выглядит как «прогоны не могут войти», и на поиск
      # настоящей причины уходит час (проверено).
      - name: Запуск сервера
        working-directory: ${{ runner.temp }}/api
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5055
          # Модули прогона: `id` — умолчание, `costs` нужен форме счёта (issue #1076). Без него
          # экран счетов закрыт воротами модуля, и прогон счетов отказывает с названной причиной —
          # молча зелёным он не станет.
          Modules__Enabled: id,costs
          # Адрес, а не имя localhost (issue #1151): одно значение на все окружения, как и порт. На
          # машине разработчика имя разрешается сначала в ::1, а порт контейнера по IPv6 молчит —
          # каждое новое подключение ждало по семь секунд. Здесь выигрыша не мерили: правка ради
          # того, чтобы строка в CI не расходилась со стендом и тестами.
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5433;Database=bhs_crg_e2e;Username=postgres;Password=xxsystem
          # Ключ подписи — одноразовый и живёт ровно столько, сколько работа. Секретом он не
          # является: база и адрес существуют только внутри этого прогона.
          Jwt__Key: ci-only-signing-key-for-live-smokes-not-a-secret
          # Ключи Garage: формат жёсткий (GK + 24 hex у идентификатора, 64 hex у секрета), поэтому
          # прежние «minioadmin» не годятся. Значения те же, что у дев-стенда, и секретом не
          # являются — хранилище живёт внутри прогона.
          BlobStorage__Endpoint: 127.0.0.1:3900
          BlobStorage__AccessKey: GK0123456789abcdef01234567
          BlobStorage__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BlobStorage__Bucket: bhs-crg-e2e
          AllowedOrigins: http://localhost:4173
          App__PublicUrl: http://localhost:4173
          TYPST_PATH: /usr/local/bin/typst
          OfficeConverter__BaseUrl: http://127.0.0.1:3910
        run: |
          nohup dotnet ./BHS.CRG.Api.dll > ${{ runner.temp }}/api.log 2>&1 &
          echo "сервер запущен, ждём в шаге посева"

      # Посев ждёт готовности сервера сам и печатает переменные прогонов — их кладём в окружение
      # работы. Данные синтетические: репозиторий публичный, дамп рабочей базы сюда нельзя.
      - name: Посев данных
        working-directory: src/client
        env:
          SEED_API: http://localhost:5055
        run: |
          # pipefail обязателен: код возврата конвейера — это код `tee`, то есть НОЛЬ. Без него
          # упавший посев проходит молча, и работа краснеет позже и не там (или зеленеет на
          # полупустой базе, где проверки сообщают «проверять нечего»).
          set -o pipefail
          node e2e/seed.mjs | tee ${{ runner.temp }}/seed.out
          grep '^SMOKE_' ${{ runner.temp }}/seed.out >> "$GITHUB_ENV"

      # ⚠️ ПЕРЕЗАПУСК ПОСЛЕ ПОСЕВА — не перестраховка, без него форма счёта не проверяется вовсе.
      # Тип «СчётНаОплату» ссылается полями «Поставщик» и «Плательщик» на тип «Организация», а его
      # заводит ЧЕЛОВЕК (ни ядро, ни миграция его не создают) — то есть на чистой базе его создаёт
      # посев, уже после старта сервера. Проекция типов модуля идёт ОДИН раз, при запуске: к нему
      # цели ещё нет, тип счёта пропускается с записью в журнал, и адреса счёта отвечают отказом
      # «тип не заведён». Ровно это и обещает сообщение о пропуске — «появится при следующем
      # запуске»; здесь этот следующий запуск и делается.
      - name: Перезапуск сервера после посева
        working-directory: ${{ runner.temp }}/api
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5055
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5433;Database=bhs_crg_e2e;Username=postgres;Password=xxsystem
          Jwt__Key: ci-only-signing-key-for-live-smokes-not-a-secret
          Modules__Enabled: id,costs
          BlobStorage__Endpoint: 127.0.0.1:3900
          BlobStorage__AccessKey: GK0123456789abcdef01234567
          BlobStorage__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          BlobStorage__Bucket: bhs-crg-e2e
          AllowedOrigins: http://localhost:4173
          App__PublicUrl: http://localhost:4173
          TYPST_PATH: /usr/local/bin/typst
          # Тот же конвертер, что у первого запуска: перезапущенный без него сервер отвечал бы на
          # Excel «конвертер не настроен», и прогон счетов краснел бы без единого запроса к нему.
          OfficeConverter__BaseUrl: http://127.0.0.1:3910
        run: |
          # ⚠️ Сначала УБЕДИТЬСЯ, что прежний умер, и только потом поднимать новый. Иначе второй
          # экземпляр падает на занятом порту, а `curl /api/version` отвечает от СТАРОГО сервера —
          # шаг печатает «поднялся заново» и зеленеет на сервере без типа счёта. Красный прогон
          # счетов после такого разбирают как поломку формы.
          pkill -f 'BHS.CRG.Api.dll' || true
          for _ in $(seq 1 30); do pgrep -f 'BHS.CRG.Api.dll' >/dev/null || break; sleep 1; done
          if pgrep -f 'BHS.CRG.Api.dll' >/dev/null; then
            echo "прежний сервер не остановился за 30 с — перезапуск отменён"; exit 1
          fi
          # Порт тоже обязан освободиться: процесс уходит раньше, чем ядро закрывает сокет.
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5055/api/version || break; sleep 1; done
          if curl -sf -o /dev/null http://localhost:5055/api/version; then
            echo "на 5055 всё ещё кто-то отвечает — новый сервер не поднять"; exit 1
          fi

          nohup dotnet ./BHS.CRG.Api.dll >> ${{ runner.temp }}/api.log 2>&1 &
          started=$!
          for _ in $(seq 1 60); do
            if ! kill -0 "$started" 2>/dev/null; then
              echo "сервер завершился, не ответив"; tail -n 50 ${{ runner.temp }}/api.log; exit 1
            fi
            if curl -sf -o /dev/null http://localhost:5055/api/version; then
              echo "сервер поднялся заново (pid $started)"; exit 0
            fi
            sleep 2
          done
          echo "сервер не поднялся за две минуты"; tail -n 50 ${{ runner.temp }}/api.log; exit 1

      # Прогоны идут по СОБРАННОМУ клиенту, а не по dev-серверу: проверять надо то, что поедет
      # в продакшн. Прокси на API у preview свой — адрес берётся из API_TARGET.
      - name: Запуск клиента
        working-directory: src/client
        env:
          API_TARGET: http://localhost:5055
        run: |
          nohup npx vite preview --port 4173 --strictPort > ${{ runner.temp }}/web.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then echo "клиент отвечает"; exit 0; fi
            sleep 2
          done
          echo "клиент не поднялся за минуту"; cat ${{ runner.temp }}/web.log; exit 1

      - name: Живые прогоны
        working-directory: src/client
        env:
          # Пакет, поставленный вместе с браузером в шаге подготовки (см. там).
          PLAYWRIGHT_PKG: ${{ runner.temp }}/playwright/node_modules/playwright/index.js
        run: npm run test:e2e:ci

      # Разбирать красный прогон по одной строке «✗ …» невозможно: причина обычно в логе сервера.
      - name: Логи при провале
        if: failure()
        run: |
          echo '── сервер ──'; tail -n 200 ${{ runner.temp }}/api.log || true
          echo '── клиент ──'; tail -n 50 ${{ runner.temp }}/web.log || true
          # Хранилище тоже: когда падает оно, инициализация сообщает лишь «узел не ответил», а
          # причина (порт занят, битый конфиг, нехватка места) видна только здесь.
          echo '── хранилище ──'; docker logs --tail 50 garage 2>&1 || true
          echo '── конвертер ──'; docker logs --tail 50 converter 2>&1 || true
