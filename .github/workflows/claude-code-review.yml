name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # PR, тронувший ТОЛЬКО планирование — ТЗ и спецификации, — не ревьюим: кода в нём нет, а такие PR
    # идут сериями. Фильтр путей здесь допустим, потому что проверка не обязательная: у обязательной
    # не запущенный workflow оставил бы её ждать вечно (почему ci.yml делает то же через `if:` —
    # в его заголовке). Фильтр сравнивает весь диф PR, а не последний push: PR, где есть хоть один
    # файл вне этих каталогов, ревьюится целиком.
    paths-ignore:
      - 'docs/tz/**'
      - 'openspec/**'

jobs:
  claude-review:
    # Не на PR от Dependabot (#933): такие запуски получают только секреты Dependabot, токен Claude в
    # них пустой, и проверка падала красным на каждом бампе образа — неотличимо от настоящей поломки.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

