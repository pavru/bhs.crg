# Обновления сторонних образов (issue #878) и действий в workflow (issue #1179, внизу файла).
#
# ЗАЧЕМ. Версии образов прибиты точно, и обновляться сами они больше не могут — это и была цель.
# Но прибить и забыть значит остаться на позапрошлогоднем постгресе, поэтому смотреть за выпусками
# должен кто-то, кроме памяти. Dependabot раз в неделю открывает PR с бампом тега; PR проходит
# ВЕСЬ здешний CI, включая живые прогоны браузером на настоящем хранилище, — то есть «оно не сломалось»
# проверяется ДО слияния, а не после обновления продакшна.
#
# ⚠️ ЧЕГО ЭТА НАСТРОЙКА НЕ ПОКРЫВАЕТ. Названо здесь, потому что молчаливая дыра в проверке хуже
# отсутствующей проверки: на неё полагаются.
#
# 1. MinIO и mc. Из-под наблюдения ВЫБЫЛИ СОВСЕМ, и ждать по ним нечего: репозиторий `minio/minio`
#    архивирован 13.02.2026 — community-версия больше не собирается, security-фиксов не будет,
#    официальный путь — коммерческий AIStor (issue #882). Мы держим копию последнего выпуска в своём
#    реестре (`ghcr.io/pavru/minio`, `ghcr.io/pavru/mc`) с замороженным навсегда тегом. Двинуть его
#    некуда — не «Dependabot не умеет», а «нового не существует». Замена хранилища будет не бампом
#    тега, а сменой продукта, со своим issue и своими прогонами.
#    (Теги и так не semver — `RELEASE.2025-09-07T16-13-09Z`, — поэтому ignore ниже лишь закрепляет
#    намерение: даже начни Dependabot их понимать, «обновлять» ему нечего.)
# 2. .NET. В `Dockerfile.api` стоит `FROM mcr.microsoft.com/dotnet/sdk:${DOTNET}` — версия за ARG,
#    подстановку Dependabot не разрешает и такой FROM пропускает. Версия .NET и так меняется вместе
#    с целевой платформой решения, то есть осознанно.
# 3. Typst. Не образ, а бинарь, скачиваемый в `Dockerfile.api` по `ARG TYPST_VERSION`. Обновляется
#    руками; CI читает версию оттуда же, чтобы проверять тем компилятором, что поедет в поставку.
# 4. ⚠️ GARAGE ПРИЕЗЖАЕТ ТРЕМЯ PR СРАЗУ, и поодиночке каждый из них КРАСНЫЙ. Версия записана в ТРЁХ
#    файлах — `deploy/docker-compose.yml` и `docker-compose.yml` (серверы поставки и дев-стенда) и
#    `deploy/Dockerfile.garage-init` (`FROM`, откуда берётся бинарь CLI). Бот открывает PR НА КАЖДЫЙ
#    файл: `directories` у docker-compose одним PR их не объединяет (проверено на 2.4.1: #913, #915),
#    а `Dockerfile` вообще другая экосистема (#916). Сторож в CI требует, чтобы версии совпадали
#    (клиент и сервер Garage обязаны быть одной версии), поэтому каждый PR падает — и это правильное
#    поведение, а не поломка. Порядок действий: поднять версию во всех трёх файлах одной веткой руками,
#    слить её, а три PR бота закрыть (как в #933). Записано здесь, потому что иначе красный бамп
#    выглядит как регресс.

version: 2
updates:
  # Базовые образы Dockerfile'ов: node и nginx у web, .NET у api (последний пропускается — см. выше).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Мажор Node — это смена рантайма сборки клиента, а не бамп патча: делается осознанно и
      # вместе с версией в CI (`setup-node`), иначе собранный клиент и проверенный разъедутся.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # Образы поставки и дев-стенда. Файлов три: рабочий compose, оверлей сборки и дев-compose в корне.
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Конвертер офисных файлов объявлен в обоих compose-файлах, и сторож (deploy/converter.tests.sh)
    # требует, чтобы они совпадали. Группа просит бота поднять образ в обоих одним PR. Если он
    # всё же откроет два — порядок тот же, что у Garage (см. выше): одной веткой руками.
    groups:
      converter:
        patterns: ['gotenberg/gotenberg']
    ignore:
      # Мажор PostgreSQL — НЕ бамп тега. Контейнер новой мажорной версии на каталоге данных от
      # прежней просто не стартует (падает громко, данные не портит), а переход требует pg_upgrade
      # или дампа с восстановлением. Это отдельная работа со своей задачей и своим разделом в
      # DEPLOYMENT.md, а не PR от бота, который выглядит как остальные.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # Наша копия архивированного MinIO (issue #882): тег заморожен навсегда, обновлять неоткуда.
      - dependency-name: ghcr.io/pavru/minio
      - dependency-name: ghcr.io/pavru/mc

  # Действия в workflow (issue #1179). За ними не следил никто, и узнали об этом от раннера: он
  # запускал действия, собранные под Node 20, на Node 24 принудительно и предупреждал в каждом
  # прогоне.
  #
  # Действия закреплены по SHA коммита, версия — в комментарии (`@3d3c… # v7.0.1`): тег можно
  # передвинуть, коммит — нет, а этим действиям достаются ключ записи в master (повышение версии)
  # и право публиковать образы (выпуск). Dependabot ведёт и SHA, и комментарий сам. Цена — PR
  # приходит на любой новый выпуск, не только на мажор (claude-code-action выходит чуть ли не
  # ежедневно), поэтому раз в месяц, а не в неделю.
  #
  # Одним PR на все действия: семь отдельных PR — это семь прогонов CI, каждый из которых после
  # слияния соседа надо обновлять.
  #
  # ⚠️ ЗЕЛЁНЫЙ PR ПРО `bump-version.yml` И `release.yml` ГОВОРИТ МАЛО. На PR они не запускаются:
  # повышение версии — лишь на push в master, выпуск — лишь вручную. actionlint в CI читает их
  # синтаксис и выражения, но входы действий по SHA не сверяет. Перед слиянием:
  #   - действия Docker — пробный выпуск с ветки PR: gh workflow run release.yml --ref <ветка> -f dry_run=true;
  #   - `actions/checkout` — заметки к выпуску: им повышение версии пишет в master ключом, и смена
  #     того, как он хранит учётные данные, — ровно то, что там надо прочесть.
  #   Мажор действия выходит не только при смене рантайма или входов: checkout v7 и
  #   setup-dotnet v6 — переход на ESM. Читать заметки нужно к каждому.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
