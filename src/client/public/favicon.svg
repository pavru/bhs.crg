<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 119.97 119.97" role="img" aria-labelledby="t">
  <title id="t">BimHouse</title>
  <!-- Знак BimHouse. Мастер-файл: docs/brand/BimHouseLogoNoName.svg, PNG-иконки собираются
       из него же (`npm run icons` в docs/tools).

       Тёмная половина знака на тёмной панели браузера сливается с фоном, поэтому SVG светлеет
       сам по prefers-color-scheme: favicon рендерится браузером как документ, и media query
       внутри него работает — в отличие от PNG, где пришлось бы держать два файла. Бирюза
       остаётся прежней: она читается на обоих фонах.

       Осторожно с комментариями: это XML, и два дефиса подряд внутри комментария делают файл
       невалидным целиком (иконка тогда просто не рисуется, молча). Имена CSS-переменных здесь
       поэтому не пишем.

       Исходные 119.97×119.68 дотянуты до квадрата (иначе иконка плющится на 16px), содержимое
       сдвинуто на половину разницы. Полей нет намеренно: на 16px знак должен занимать всё поле,
       safe-zone нужна только maskable-иконке, и та собирается отдельно. -->
  <style>
    svg { --brand: #109e92; --ink: #33364d }
    @media (prefers-color-scheme: dark) { svg { --ink: #e8eaf4 } }
    .b, .i { stroke-width: .5; stroke-miterlimit: 10 }
    .b { fill: var(--brand); stroke: var(--brand) }
    .i { fill: var(--ink); stroke: var(--ink) }
    .bo, .io { fill: none; stroke-width: 4.25; stroke-miterlimit: 10 }
    .bo { stroke: var(--brand) }
    .io { stroke: var(--ink) }
  </style>
