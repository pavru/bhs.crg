<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Значки и манифест отдаёт СЕРВЕР (issue #1315): из логотипа компании, а пока его нет —
         стандартные. Поэтому здесь адреса, а не файлы, и без метки версии: этот файл статический и
         версию логотипа знать не может. Свежесть держит сервер — ответ с проверкой по тегу (304),
         а не длинный кеш; поднимать что-либо руками при смене картинок больше не нужно (так было с
         ?v, issue #728). Вкладке, открытой в момент смены логотипа, ссылку с новой меткой ставит
         приложение.
         Без type: адрес отдаёт то SVG (стандартный знак), то PNG (из логотипа), и тип называет
         сам ответ. -->
    <link rel="icon" href="/api/branding/icons/tab" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BHS.CRG</title>
    <!-- PWA: устанавливаемое приложение / ярлык Chrome в отдельном окне (без service worker) -->
    <link rel="manifest" href="/api/branding/manifest.webmanifest" />
    <!-- Бирюза знака BimHouse, а не синий интерфейса (issue #728). С логотипом заказчика на значке
         цвет строки браузера остаётся этим же: решение владельца продукта от 13.10.2026 — цвет не
         трогаем. То же значение стоит в манифесте, который собирает сервер (BrandManifest). -->
    <meta name="theme-color" content="#109e92" />
    <!-- Отдельный значок, а не тот же, что у приложения: iOS не маскирует прозрачность, а заливает
         её чёрным, и значку нужен собственный фон с полями под системное скругление. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/api/branding/icons/apple" />
    <!-- Тема до первой отрисовки. Отдельным файлом, а не инлайном: см. public/theme-init.js -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
